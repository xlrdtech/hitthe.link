*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:14px}
body{padding:26px 14px 60px;-webkit-font-smoothing:antialiased;min-height:100vh;

.wrap{max-width:1040px;margin:0 auto}
h1{margin:0 0 4px;font-size:22px;letter-spacing:-.02em;font-weight:600}
.sub{color:var(--tx-dim);font-size:12.5px;margin:0 0 20px;font-family:var(--mono)}
.glass{position:relative;border-radius:var(--r);

  overflow:hidden}
.glass::before{content:'';position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:linear-gradient(152deg,rgba(255,255,255,.17),transparent 26%,transparent 66%,rgba(0,220,130,.12))}
.glass::after{content:'';position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:linear-gradient(180deg,rgba(255,255,255,.10) 0,rgba(255,255,255,0) 14%),

.searchwrap{position:sticky;top:10px;z-index:20;margin-bottom:16px}
.search{display:flex;align-items:center;gap:12px;padding:0 22px;height:60px;border-radius:var(--pill)}
.search input{flex:1;background:none;border:0;outline:0;color:var(--tx);font-size:16px;min-width:0}
.search input::placeholder{color:var(--tx-mute)}
.mag{width:16px;height:16px;border:1.8px solid var(--accent);border-radius:50%;flex:none;position:relative;opacity:.85}
.mag::after{content:'';position:absolute;right:-6px;bottom:-6px;width:8px;height:1.8px;background:var(--accent);transform:rotate(45deg);border-radius:2px}
.count{font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:.08em;flex:none}
.pills{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:18px}
.pill{border-radius:var(--pill);padding:9px 17px;cursor:pointer;user-select:none;
  font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--tx-dim)}
.pill.on{color:var(--accent);border-color:var(--rim-hot);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.26),0 0 26px rgba(0,220,130,.22)}
.list{display:grid;gap:11px}
.card{padding:17px 21px;border-radius:var(--r)}
.top{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap;margin-bottom:7px}
.thing{font-family:var(--mono);font-size:13.5px;color:var(--accent);font-weight:600;flex:1;min-width:0;word-break:break-word}
.kind,.date{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;padding:4px 11px;border-radius:var(--pill);

.reason{color:var(--tx);line-height:1.6;font-size:13px}
.quote{margin-top:9px;padding:10px 15px;border-left:2px solid var(--rim-hot);border-radius:0 12px 12px 0;
  background:rgba(0,220,130,.05);color:var(--accent-2);font-size:12.5px;font-style:italic;line-height:1.55}

.empty{padding:40px;text-align:center;color:var(--tx-mute);font-family:var(--mono);font-size:12px}
.foot{margin-top:24px;color:var(--tx-mute);font-family:var(--mono);font-size:10.5px;text-align:center;line-height:1.8}
</style>

const NOW=1788155917;
const list=document.getElementById('list'),q=document.getElementById('q'),count=document.getElementById('count');
let sort='new';
function ago(t){const s=NOW-t;
  if(s<3600)return Math.max(1,Math.round(s/60))+'m ago';
  if(s<86400)return Math.round(s/3600)+'h ago';
  return Math.round(s/86400)+'d ago';}
function render(){
  const term=q.value.trim().toLowerCase();
  let rows=DATA.filter(d=>!term||(d.slug+' '+d.msg).toLowerCase().includes(term));
  if(sort==='today')rows=rows.filter(d=>NOW-d.at<86400);
  if(sort==='old')rows=[...rows].sort((a,b)=>a.at-b.at);
  else if(sort==='az')rows=[...rows].sort((a,b)=>a.slug.localeCompare(b.slug));
  else rows=[...rows].sort((a,b)=>b.at-a.at);
  count.textContent=rows.length;
  list.innerHTML=rows.slice(0,300).map(d=>
    '<a class="glass row" href="/'+d.slug+'/" target=_blank rel=noopener>'+
    '<span class=slug>'+d.slug+'</span>'+
    '<span class=msg>'+d.msg.replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))+'</span>'+
    '<span class=when>'+ago(d.at)+'</span></a>').join('')
    ||'<div class=empty>nothing matches</div>';
}
q.addEventListener('input',render);
document.getElementById('sorts').addEventListener('click',ev=>{
  const p=ev.target.closest('.pill'); if(!p)return; sort=p.dataset.s;
  [...document.querySelectorAll('.pill')].forEach(x=>x.classList.toggle('on',x===p)); render();});
addEventListener('keydown',ev=>{if(ev.key==='/'&&document.activeElement!==q){ev.preventDefault();q.focus()}});
