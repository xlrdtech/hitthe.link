<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0a0a0f" />
<title>LTV % — Life Time Value · Credit Hero H.O.T.⁷</title>
<meta name="description" content="L7S Credit Hero — Life Time Value (LTV) against CAC. Churn-derived or fixed lifespan, live LTV:CAC ratio and CAC payback in months, against the 3x health line." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --gold-primary:#D2AC47;--gold-secondary:#f7e08a;--gold-dark:#b9932d;
    --gold-gradient:linear-gradient(135deg,#D2AC47 10%,#f7e08a 50%,#b9932d 90%);
    --gold:#D2AC47;--gold-soft:#b9932d;
    --bg:#0a0a0f;--bg-card:#13131a;--bg-card-2:#16161e;--panel-2:#1b1b24;
    --text:#f4f1e8;--text-dim:#a8a29a;
    --line:rgba(210,172,71,.20);--line-soft:rgba(255,255,255,.06);
    --best:#6ee7b7;--excellent:#34d399;--good:#fbbf24;--warn:#fb923c;--red:#ef4444;
    --radius:18px;--glow:0 0 30px 8px rgba(210,172,71,.18);--shadow:0 24px 60px rgba(0,0,0,.55);
    --font-figures:'IBM Plex Mono','Roboto Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box}html,body{margin:0;padding:0}
  body{font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%,rgba(210,172,71,.07),transparent 60%),var(--bg);
    color:var(--text);min-height:100vh;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  .wrap{max-width:560px;margin:0 auto;padding:28px 20px 64px}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--gold-gradient);box-shadow:var(--glow)}
  .brand .kicker{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:700}
  h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:8px 0 4px}
  h1 .pct{background:var(--gold-gradient);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .sub{color:var(--text-dim);font-size:14.5px;margin-bottom:26px}
  .card{background:linear-gradient(180deg,var(--bg-card),var(--bg-card-2));border:1px solid var(--line);
    border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
  label{display:block;font-size:13px;font-weight:600;color:var(--text-dim);margin:14px 0 7px;letter-spacing:.01em}
  label:first-child{margin-top:0}
  .field{position:relative}
  .field .pre{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--gold-soft);font-weight:600;font-family:var(--font-figures)}
  .field.suf .pre{left:auto;right:14px}
  input[type=number]{width:100%;padding:13px 14px 13px 30px;font-size:17px;font-family:var(--font-figures);
    background:var(--panel-2);border:1px solid var(--line-soft);border-radius:12px;color:var(--text);outline:none;transition:.15s}
  .field.suf input[type=number]{padding:13px 34px 13px 14px}
  input[type=number]:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(210,172,71,.14)}
  input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .seg{display:inline-flex;gap:0;margin-bottom:4px}
  .seg button{font:600 11px/1 'Poppins',sans-serif;letter-spacing:.08em;text-transform:uppercase;
    padding:9px 14px;background:var(--panel-2);border:1px solid var(--line-soft);color:var(--text-dim);cursor:pointer;transition:.15s}
  .seg button:first-child{border-radius:99px 0 0 99px}
  .seg button:last-child{border-radius:0 99px 99px 0;border-left-width:0}
  .seg button.on{color:var(--gold);border-color:var(--line);background:rgba(210,172,71,.10)}
  .gauge{text-align:center;padding:8px 0 4px}
  .gauge .val{font-size:52px;font-weight:800;font-family:var(--font-figures);line-height:1;letter-spacing:-.03em;color:var(--gold-primary)}
  .gauge .tier{font-size:14px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-top:8px}
  .rows{margin-top:20px;border-top:1px solid var(--line-soft);padding-top:6px}
  .row{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:9px 0;border-bottom:1px solid var(--line-soft)}
  .row:last-child{border-bottom:0}
  .row .k{font-size:13px;color:var(--text-dim)}
  .row .v{font-size:15px;font-weight:600;font-family:var(--font-figures);white-space:nowrap}
  .formula{margin-top:16px;font-size:12.5px;color:var(--text-dim);line-height:1.75;font-family:var(--font-figures)}
  .formula code{color:var(--gold);background:rgba(210,172,71,.08);padding:1px 6px;border-radius:5px}
  .back{display:inline-block;margin-top:8px;font-size:13px;color:var(--gold);text-decoration:none;border-bottom:1px solid rgba(210,172,71,.35);padding-bottom:1px}
  .back:hover{color:var(--gold-secondary)}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><span class="dot"></span><span class="kicker">L7S Credit Hero · H.O.T.⁷</span></div>
  <h1>LTV <span class="pct">%</span></h1>
  <div class="sub">Life Time Value — the margin dollars one customer returns before they churn, measured against what it cost to win them. <b>LTV:CAC below 3× is the warning line.</b></div>

  <div class="card">
    <label>Lifespan basis</label>
    <div class="seg" id="mode">
      <button data-mode="churn" class="on">From churn</button>
      <button data-mode="lifespan">Enter directly</button>
    </div>

    <label>ARPU — avg revenue per user, monthly</label>
    <div class="field"><span class="pre">$</span><input id="arpu" type="number" inputmode="decimal" placeholder="49" value="49"></div>

    <label>Gross margin</label>
    <div class="field suf"><span class="pre">%</span><input id="margin" type="number" inputmode="decimal" placeholder="80" value="80"></div>

    <div id="churnField">
      <label>Monthly churn rate</label>
      <div class="field suf"><span class="pre">%</span><input id="churn" type="number" inputmode="decimal" placeholder="5" value="5"></div>
    </div>

    <div id="lifespanField" style="display:none">
      <label>Avg customer lifespan (months)</label>
      <div class="field suf"><span class="pre">mo</span><input id="lifespan" type="number" inputmode="decimal" placeholder="20" value="20"></div>
    </div>

    <label>CAC — customer acquisition cost</label>
    <div class="field"><span class="pre">$</span><input id="cac" type="number" inputmode="decimal" placeholder="300" value="300"></div>
  </div>

  <div class="card">
    <div class="gauge">
      <div class="val" id="oLtv">—</div>
      <div class="tier" id="oRatioBadge">—</div>
    </div>
    <div class="rows">
      <div class="row"><span class="k">LTV : CAC — target ≥ 3×</span><span class="v" id="oRatio">—</span></div>
      <div class="row"><span class="k">CAC payback</span><span class="v" id="oPayback">—</span></div>
      <div class="row"><span class="k">Avg lifespan <span id="oLifeNote" style="opacity:.6"></span></span><span class="v" id="oLife">—</span></div>
    </div>
    <div class="formula" id="formula"></div>
  </div>

  <a class="back" href="../">← All Credit Hero calculators</a>
</div>

<script>
  // Formulas, thresholds and verdict copy preserved verbatim from qi's original
  // credit-hero-ltv.html (2026-07-01). Only the shell was restyled to the suite.
  var $=function(id){return document.getElementById(id);};
  var mode="churn";
  var fmt$=function(n){ if(!isFinite(n)) return "∞"; return "$"+Math.round(n).toLocaleString("en-US"); };

  function calc(){
    var arpu   = parseFloat($("arpu").value)   || 0;
    var margin = (parseFloat($("margin").value) || 0) / 100;
    var cac    = parseFloat($("cac").value)    || 0;
    var lifespan, churn, ltv;

    if(mode === "churn"){
      churn = (parseFloat($("churn").value) || 0) / 100;
      lifespan = churn > 0 ? (1 / churn) : Infinity;
      ltv = churn > 0 ? (arpu * margin) / churn : Infinity;   // (ARPU × margin) ÷ churn
      $("oLifeNote").textContent = "1 ÷ churn";
    } else {
      lifespan = parseFloat($("lifespan").value) || 0;
      churn = lifespan > 0 ? (1 / lifespan) : 0;
      ltv = arpu * margin * lifespan;                          // ARPU × margin × lifespan
      $("oLifeNote").textContent = "entered directly";
    }

    var ratio   = cac > 0 ? (ltv / cac) : Infinity;
    var mMargin = arpu * margin;
    var payback = mMargin > 0 ? (cac / mMargin) : Infinity;    // months of margin to recover CAC

    $("oLtv").textContent   = fmt$(ltv);
    $("oRatio").textContent = isFinite(ratio) ? ratio.toFixed(1)+"×" : "∞";
    $("oPayback").textContent = isFinite(payback) ? (payback < 100 ? payback.toFixed(1) : Math.round(payback))+" mo" : "∞";
    $("oLife").textContent  = isFinite(lifespan) ? (lifespan < 100 ? lifespan.toFixed(1) : Math.round(lifespan))+" mo" : "∞";

    // 3:1 is the industry health line, 1:1 = losing money
    var badge=$("oRatioBadge"), col, txt;
    if(!isFinite(ratio) || ratio >= 3){ col="var(--best)";  txt="Healthy · scale spend"; }
    else if(ratio >= 1){               col="var(--warn)";  txt="Thin · improve retention or CAC"; }
    else {                             col="var(--red)";   txt="Underwater · CAC exceeds LTV"; }
    badge.style.color=col; badge.textContent=txt;
    $("oLtv").style.color = col;

    var f;
    if(mode === "churn"){
      f = "LTV = (ARPU × margin) ÷ churn = ($" + arpu.toLocaleString() +
          " × " + Math.round(margin*100) + "%) ÷ " + $("churn").value + "% = <code>" + fmt$(ltv) + "</code>";
    } else {
      f = "LTV = ARPU × margin × lifespan = $" + arpu.toLocaleString() +
          " × " + Math.round(margin*100) + "% × " + lifespan + " mo = <code>" + fmt$(ltv) + "</code>";
    }
    f += "<br>LTV:CAC = " + fmt$(ltv) + " ÷ $" + cac.toLocaleString() +
         " = <code>" + (isFinite(ratio)?ratio.toFixed(2)+"×":"∞") + "</code> &nbsp;·&nbsp; target ≥ <code>3×</code>";
    $("formula").innerHTML = f;
  }

  var segBtns = document.querySelectorAll("#mode button");
  segBtns.forEach(function(b){
    b.addEventListener("click", function(){
      segBtns.forEach(function(x){ x.classList.remove("on"); });
      b.classList.add("on");
      mode = b.getAttribute("data-mode");
      $("churnField").style.display    = (mode==="churn")    ? "" : "none";
      $("lifespanField").style.display = (mode==="lifespan") ? "" : "none";
      calc();
    });
  });
  ["arpu","margin","churn","lifespan","cac"].forEach(function(id){
    $(id).addEventListener("input", calc);
  });
  calc();
</script>
</body>
</html>
