<title>xen ear</title>
<style>
  :root { --bg:#0a0a0e; --hero:#34d17a; --dim:#6b7280; --fg:#e8e8ec; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
         min-height:100vh; display:flex; flex-direction:column; align-items:center;
         padding:32px 20px; gap:20px; }
  h1 { font-size:15px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim);
       font-weight:600; margin:0; }
  #dot { width:84px; height:84px; border-radius:50%; background:#1a1a22;
         border:2px solid #2a2a35; transition:all .18s; }
  #dot.live { background:var(--hero); border-color:var(--hero);
              box-shadow:0 0 40px rgba(52,209,122,.5); }
  #dot.speech { transform:scale(1.12); }
  #state { color:var(--dim); font-size:13px; letter-spacing:.05em; min-height:1.4em; }
  #tx { width:100%; max-width:560px; min-height:120px; background:#111118;
        border:1px solid #22222c; border-radius:14px; padding:16px 18px;
        font-size:17px; line-height:1.5; overflow-y:auto; max-height:46vh; }
  #tx .p { color:var(--dim); }
  #log { width:100%; max-width:560px; font:11px/1.6 ui-monospace,SFMono-Regular,monospace;
         color:#4b5563; white-space:pre-wrap; word-break:break-word; }
  button { background:var(--hero); color:#04120a; border:0; border-radius:999px;
           padding:14px 34px; font-size:16px; font-weight:650; letter-spacing:.02em; }
</style>

<h1>xen ear</h1>
<div id="dot"></div>
<div id="state">tap once to open the mic</div>
<button id="go">start</button>
<div id="tx"></div>
<div id="log"></div>

<script>
const $ = (id) => document.getElementById(id);
const log = (m) => { $('log').textContent = (m + '\n' + $('log').textContent).slice(0, 1400); };
const setState = (s) => { $('state').textContent = s; };

// Where transcripts go — the SAME proven `in:` route the old sidecar used.
const INJECT = 'https://api.xlrd.org/api/dictate-inject';
const BARGE  = 'https://api.xlrd.org/api/omni/event';
const TOKEN  = 'https://api.xlrd.org/api/inworld-token';
const WS_URL = 'wss://api.inworld.ai/stt/v1/transcribe:streamBidirectional';
const RATE   = 16000;

let ws, ctx, node, stream, frames = 0, pending = '';

async function post(url, body) {
  try {
    const r = await fetch(url, { method:'POST', headers:{'content-type':'application/json'},
                                 body: JSON.stringify(body) });
    return r.status;
  } catch (e) { log('post failed ' + e.message); return 0; }
}

// Zero taps, ever (qi's standing rule). Fired from Inworld's own server-side VAD
// the instant he starts talking — not from a button, not from a local threshold.
function barge() { post(BARGE, { event:'xen:barge', source:'ear-vad' }); }

function render(text, final) {
  const el = $('tx');
  if (final) { el.insertAdjacentHTML('afterbegin', '<div>' + text + '</div>'); pending = ''; }
  else { let p = el.querySelector('.p'); if (!p) { el.insertAdjacentHTML('afterbegin', '<div class="p"></div>'); p = el.querySelector('.p'); } p.textContent = text; }
}

async function start() {
  $('go').style.display = 'none';
  setState('getting mic…');
  stream = await navigator.mediaDevices.getUserMedia({
    audio: { channelCount:1, echoCancellation:true, noiseSuppression:true, autoGainControl:true }
  });

  setState('getting token…');
  let key = '';
  try {
    const r = await fetch(TOKEN, { method:'POST' });
    key = (await r.json()).token || '';
  } catch (e) { log('token fetch failed: ' + e.message); }
  if (!key) { setState('no token — cannot open socket'); return; }

  setState('connecting…');
  ws = new WebSocket(WS_URL, ['Authorization', 'Basic ' + key]);
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => {
    // TRAP 4: audioEncoding at the TOP of transcribeConfig, not nested in audioConfig.
    ws.send(JSON.stringify({ transcribeConfig: {
      modelId: 'inworld/inworld-stt-1',     // TRAP 3: provider prefix required
      audioEncoding: 'LINEAR16',
      sampleRateHertz: RATE,
    }}));
    $('dot').classList.add('live');
    setState('listening');
    pump();
  };

  ws.onmessage = (ev) => {
    frames++;
    let m; try { m = JSON.parse(ev.data); } catch { return; }
    if (m.error) { log('ERR ' + m.error.message); setState('error — see log'); return; }
    const r = m.result || m;
    if (r.speechStarted) { $('dot').classList.add('speech'); barge(); return; }
    if (r.speechStopped) {
      $('dot').classList.remove('speech');
      if (pending) { render(pending, true); post(INJECT, { text: pending, source:'xen-ear' }); }
      return;
    }
    const t = r.transcription && (r.transcription.transcript || r.transcription.text);
    if (!t) return;
    // TRAP 7: short utterances are ALL isFinal:false. Hold the latest partial
    // (they are cumulative — each supersedes the last) and commit at speech end.
    if (r.transcription.isFinal) { render(t, true); post(INJECT, { text:t, source:'xen-ear' }); pending = ''; }
    else { pending = t; render(t, false); }
  };

  ws.onclose = () => {
    $('dot').classList.remove('live','speech');
    // frames === 0 is the signature of a malformed config, NEVER of silence.
    setState(frames ? 'closed — reconnecting' : 'closed with ZERO frames (config is wrong)');
    setTimeout(start, 2000);
  };
  ws.onerror = () => log('socket error');
}

function pump() {
  ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: RATE });
  const src = ctx.createMediaStreamSource(stream);
  node = ctx.createScriptProcessor(2048, 1, 1);
  node.onaudioprocess = (e) => {
    if (!ws || ws.readyState !== 1) return;
    const f = e.inputBuffer.getChannelData(0);
    const pcm = new Int16Array(f.length);
    for (let i = 0; i < f.length; i++) {
      const s = Math.max(-1, Math.min(1, f[i]));
      pcm[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
    }
    let bin = ''; const b = new Uint8Array(pcm.buffer);
    for (let i = 0; i < b.length; i++) bin += String.fromCharCode(b[i]);
    // TRAP 2: the field is `content`, not `audio`.
    ws.send(JSON.stringify({ audioChunk: { content: btoa(bin) } }));
  };
  src.connect(node); node.connect(ctx.destination);
}

$('go').onclick = start;
</script>
