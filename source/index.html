<!--
  SOURCE IS THE AVATAR'S NAME.
  qi 2026-08-25 16:16, typed: "you should have the original refences fot Source
  the avatar via xlrd.life/aether"
  qi 2026-08-25 19:13, typed: "please fix life|source ...aether"

  /source/ returned GitHub's 404 on every host until this file existed. That is
  the whole of what he was reporting - the page was never broken, the route was
  never built.

  ============================================================================
  THIS IS A FORWARDER, NEVER A COPY. One page, one origin, zero drift.
  ============================================================================
  That rule is in capitals because the trap it prevents already fired once and
  cost him real time. A SECOND copy of this avatar exists at
  xlrdtech.github.io/xlrdlife/aether, and it silently rotted behind the
  canonical one. Measured 2026-08-25:

      canonical  life.xlrd.org/aether/   154,018 B   ORB_PRESETS x6
      stale copy xlrdlife/aether/        113,789 B   ORB_PRESETS x0

  Forty kilobytes behind, with ZERO occurrences of ORB_PRESETS, dense, liquid,
  ghost, crystal or the version chip. He was looking at that stale build and
  said his versions and his mass were gone. They were never gone - the copy he
  had open predated them entirely. Duplicating this file would rebuild that
  exact failure, and the next person to notice would be him again.

  The forward preserves search and hash, so /source/?v=dense and /source/#x
  both survive the crossing and land on the real switcher.
  JS first (keeps path/query/hash); meta-refresh is the no-JS fallback.
-->
<script>
  (function () {
    var t = "/aether/" + location.search + location.hash;
    location.replace(t);
  })();
</script>
<meta http-equiv="refresh" content="0;url=/aether/">

  a { color:var(--accent); text-decoration:none; }
  a:hover, a:focus-visible { text-decoration:underline; }
  .k { color:var(--dim); font-size:13px; margin-top:14px; }
  .v { display:inline-block; margin:0 7px; }
</style>
