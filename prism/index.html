<!-- superseded-by-glass-2026-08-23
     Two Xen seats independently recreated the same reference (pin.it/2aTI3AQGD)
     on the same night: this page (prism/, 6,879 B) and glass/ (12,394 B).
     Both renders were compared side by side at equal scale over CDP. glass/ won
     on the render, not the argument — asymmetric bloom, genuinely dark arcs
     between colour peaks, so it reads as refraction. This one was evenly
     saturated the whole way round: a hue wheel.
     Measured cause, from the glass/ author: ANNULUS WIDTH dominates, not colour
     weighting. At 71-73% on a 74px orb the visible band is 1-2px and dies at any
     brightness; 66% is what reads. Black stops in the conic are necessary but
     not sufficient.
     Kept as a redirect rather than deleted, so the URL never 404s. -->
