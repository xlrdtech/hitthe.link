    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      min-height: 100%;
      background: var(--bg);
      overflow-x: hidden;
      overflow-y: auto;
      touch-action: pan-y; /* Allow vertical scroll on mobile */
      font-family: 'Inter', sans-serif;
      cursor: crosshair;
    }
    body::-webkit-scrollbar { display: none; }

    canvas { display: block; position: fixed; inset: 0; outline: none; z-index: 0; }

    #ring {
      position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
      width: min(85vmin, 800px); aspect-ratio: 1; border-radius: 50%;
      border: 1px solid var(--faint);
      box-shadow: 0 0 140px rgba(94, 255, 168, 0.03) inset; pointer-events: none; z-index: 2;
      transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #ring.active { transform: translate(-50%,-50%) scale(0.95); border-color: var(--dim); box-shadow: 0 0 160px rgba(94, 255, 168, 0.08) inset; }

    .crosshair { position: fixed; left: 50%; top: 50%; width: 2px; height: 2px; background: var(--accent); transform: translate(-50%, -50%); border-radius: 50%; opacity: 0.5; z-index: 2; pointer-events: none; }
    .crosshair::before, .crosshair::after { content: ''; position: absolute; background: var(--faint); }
    .crosshair::before { width: 40px; height: 1px; left: -19px; top: 0; }
    .crosshair::after { width: 1px; height: 40px; left: 0; top: -19px; }

    .card-3d {
      width: 480px;
      background: rgba(0, 4, 0, 0.65);
      border: 1px solid rgba(94, 255, 168, 0.15);
      border-radius: 12px;
      padding: 32px;
      color: var(--ink);
      font-family: 'JetBrains Mono', monospace;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.9), 0 0 0 1px rgba(94, 255, 168, 0.05) inset;
      will-change: transform, opacity, filter;
    }
    .card-3d.ident-card {
      width: 700px;
      text-align: center;
      background: transparent;
      border: none;
      box-shadow: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .ident-card .mark {
      font-size: 110px;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      letter-spacing: -0.05em;
      color: var(--ink);
      line-height: 0.9;
      margin: 20px 0;
      text-shadow: 0 0 40px rgba(94, 255, 168, 0.15);
    }
    .ident-card .cap { font-size: 12px; letter-spacing: 0.25em; color: var(--accent); }

    .card-3d h2 {
      font-size: 22px;
      color: var(--accent);
      margin-bottom: 24px;
      font-weight: 300;
      border-bottom: 1px solid var(--faint);
      padding-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
    }
    .card-link {
      display: block;
      position: relative;
      padding: 10px 12px 10px 24px;
      background: rgba(94, 255, 168, 0.03);
      border: 1px solid rgba(94, 255, 168, 0.1);
      border-radius: 6px;
      color: var(--dim);
      text-decoration: none;
      font-size: 11px;
      letter-spacing: 0.05em;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-link::before {
      content: ''; position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
      width: 4px; height: 4px; border-radius: 50%; background: var(--dim);
      transition: all 0.3s ease;
    }
    .card-link:hover { background: rgba(94, 255, 168, 0.15); color: var(--ink); border-color: var(--accent); box-shadow: 0 0 15px rgba(94, 255, 168, 0.15); }
    .card-link:hover::before { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
    .card-link.up { color: var(--ink); border-color: rgba(94, 255, 168, 0.3); }
    .card-link.up::before { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
    .card-link.down { color: var(--faint); opacity: 0.6; }
    .card-link.down::before { background: var(--alert); box-shadow: 0 0 8px var(--alert); }

    @media (max-width: 768px) {
      #ring { width: 95vmin; }
      .card-3d { width: 340px; padding: 24px; }
      .ident-card .mark { font-size: 64px; }
    }
  </style>
</head>

const ophanim = new THREE.Group();
scene.add(ophanim);

// Plasma Core
const coreGeometry = new THREE.IcosahedronGeometry(220, 48);
const plasmaUniforms = { t: { value: 0 }, energy: { value: 0 }, morph: { value: 1 } };
const plasmaMaterial = new THREE.ShaderMaterial({
  uniforms: plasmaUniforms, transparent: true, blending: THREE.AdditiveBlending,
  depthWrite: false, side: THREE.DoubleSide, wireframe: false,
  vertexShader: `
    varying vec3 vPos; varying vec3 vNormal; varying vec3 vView;
    uniform float t; uniform float energy;
    vec4 permute(vec4 x){return mod(((x*34.0)+1.0)*x, 289.0);}
    vec4 taylorInvSqrt(vec4 r){return 1.79284291400159 - 0.85373472095314 * r;}
    float snoise(vec3 v){
      const vec2  C = vec2(1.0/6.0, 1.0/3.0) ;
      const vec4  D = vec4(0.0, 0.5, 1.0, 2.0);
      vec3 i  = floor(v + dot(v, C.yyy) );
      vec3 x0 = v - i + dot(i, C.xxx) ;
      vec3 g = step(x0.yzx, x0.xyz);
      vec3 l = 1.0 - g;
      vec3 i1 = min( g.xyz, l.zxy );
      vec3 i2 = max( g.xyz, l.zxy );
      vec3 x1 = x0 - i1 + C.xxx;
      vec3 x2 = x0 - i2 + C.yyy;
      vec3 x3 = x0 - D.yyy;
      i = mod(i, 289.0 );
      vec4 p = permute( permute( permute( i.z + vec4(0.0, i1.z, i2.z, 1.0 )) + i.y + vec4(0.0, i1.y, i2.y, 1.0 )) + i.x + vec4(0.0, i1.x, i2.x, 1.0 ));
      float n_ = 0.142857142857;
      vec3  ns = n_ * D.wyz - D.xzx;
      vec4 j = p - 49.0 * floor(p * ns.z *ns.z);
      vec4 x_ = floor(j * ns.z);
      vec4 y_ = floor(j - 7.0 * x_ );
      vec4 x = x_ *ns.x + ns.yyyy;
      vec4 y = y_ *ns.x + ns.yyyy;
      vec4 h = 1.0 - abs(x) - abs(y);
      vec4 b0 = vec4( x.xy, y.xy );
      vec4 b1 = vec4( x.zw, y.zw );
      vec4 s0 = floor(b0)*2.0 + 1.0;
      vec4 s1 = floor(b1)*2.0 + 1.0;
      vec4 sh = -step(h, vec4(0.0));
      vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy ;
      vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww ;
      vec3 p0 = vec3(a0.xy,h.x);
      vec3 p1 = vec3(a0.zw,h.y);
      vec3 p2 = vec3(a1.xy,h.z);
      vec3 p3 = vec3(a1.zw,h.w);
      vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
      p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
      vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
      m = m * m;
      return 42.0 * dot( m*m, vec4( dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3) ) );
    }
    void main() {
      vNormal = normalize(normalMatrix * normal);
      vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
      vView = normalize(-mvPos.xyz);
      float time = t * 2.0;
      float n = snoise(position * 0.012 - time);
      float n2 = snoise(position * 0.03 + time * 0.8);
      float spike = pow(max(0.0, n), 5.0) * 450.0 * (0.5 + energy * 2.5);
      vec3 pos = (position * 0.05) + normal * (spike + n2 * 10.0);
      vPos = pos;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
    }
  `,
  fragmentShader: `
    varying vec3 vPos; varying vec3 vNormal; varying vec3 vView;
    uniform float t; uniform float energy; uniform float morph;
    float hash(vec3 p) {
        p = fract(p * vec3(0.1031, 0.1030, 0.0973));
        p += dot(p, p.yxz + 33.33);
        return fract((p.x + p.y) * p.z);
    }
    float noise(vec3 x) {
        vec3 i = floor(x); vec3 f = fract(x); f = f * f * (3.0 - 2.0 * f);
        return mix(mix(mix(hash(i + vec3(0,0,0)), hash(i + vec3(1,0,0)), f.x),
                       mix(hash(i + vec3(0,1,0)), hash(i + vec3(1,1,0)), f.x), f.y),
                   mix(mix(hash(i + vec3(0,0,1)), hash(i + vec3(1,0,1)), f.x),
                       mix(hash(i + vec3(0,1,1)), hash(i + vec3(1,1,1)), f.x), f.y), f.z);
    }
    void main() {
      float dist = length(vPos) / 220.0;
      vec3 v = normalize(vPos);
      float n1 = noise(v * 6.0 + vec3(0.0, t * 4.0, t * 2.0));
      float n2 = noise(v * 12.0 - vec3(t * 3.0, 0.0, t * 4.0));
      float veins = abs(sin((n1 + n2) * 20.0));
      veins = smoothstep(0.97, 1.0, 1.0 - veins);
      float activity = veins * (1.0 + energy * 3.0);
      if (activity < 0.02) discard;
      vec3 lightningGreen = vec3(0.0, 0.85, 0.35); vec3 coreHot = vec3(0.4, 1.0, 0.6);
      vec3 color = mix(lightningGreen, coreHot, clamp(activity - 0.5, 0.0, 1.0));
      float orbW = max(0.0, 1.0 - abs(morph - 1.0));
      float alpha = activity * orbW;
      alpha *= smoothstep(2.0, 0.2, dist);
      gl_FragColor = vec4(color, alpha);
    }
  `
});

const plasmaCore = new THREE.Mesh(coreGeometry, plasmaMaterial);
ophanim.add(plasmaCore);
const glassBasePositions = coreGeometry.attributes.position.clone();

let world;
{
  const NP = 4000, p = new Float32Array(NP*3), s = new Float32Array(NP), ph = new Float32Array(NP);
  for(let i=0; i<NP; i++) {
    const r = 200 + Math.random()*2500;
    const th = Math.random()*Math.PI*2;
    p[i*3] = r * Math.cos(th);

    p[i*3+2] = (Math.random() * (START_Z + 1500)) - 1000; // Tunnel spread
    s[i] = Math.random()*2.0 + 0.5; ph[i] = Math.random()*Math.PI*2;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(p, 3));
  g.setAttribute('asize', new THREE.BufferAttribute(s, 1));
  g.setAttribute('aph', new THREE.BufferAttribute(ph, 1));
  world = new THREE.Points(g, new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: { t: {value:0} },
    vertexShader: `
      attribute float asize; attribute float aph; uniform float t; varying float vo;
      void main(){
        vec3 q = position;
        q.y += sin(t * 0.5 + aph) * 50.0;
        vec4 mv = modelViewMatrix * vec4(q, 1.0);
        float dist = -mv.z;
        // Fade close points to avoid clipping, fade far points for depth
        float fade = smoothstep(10.0, 250.0, dist) * (1.0 - smoothstep(3000.0, 5000.0, dist));
        vo = (0.1 + 0.15 * sin(t * 0.8 + aph)) * fade;
        gl_PointSize = asize * (400.0 / dist);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      varying float vo;
      void main(){
        vec2 d = gl_PointCoord - 0.5; if(length(d) > 0.5) discard;
        gl_FragColor = vec4(0.23, 1.0, 0.58, exp(-dot(d,d)*12.0) * vo);
      }`
  }));
  scene.add(world);
}

let pts, lines, base, T0, T1, T2, N=0, labels=[], bandOf=null;
const SHELL = 230;
const RINGS = [ {t:[0,0,0],r:SHELL}, {t:[1.5708,0,0],r:SHELL*1.05}, {t:[0,1.5708,0],r:SHELL*0.95}, {t:[0.5,0.5,0.2],r:SHELL*1.1}, {t:[-0.7,0.8,-0.3],r:SHELL*0.9}, {t:[1.1,0.2,0.7],r:SHELL*1.02} ];

function humanoid(i, n) {
  const u = i/n, a = Math.random()*Math.PI*2, jr = Math.random();

  if(u<0.12) { rad=45*Math.sqrt(jr); y=220+Math.sqrt(Math.max(0,1-(rad/50)**2))*40; x=Math.cos(a)*rad; z=Math.sin(a)*rad*0.8; }

  else if(u<0.60) { const ty=(u-0.35)/0.25; rad=(100-40*ty)*(0.5+0.5*jr); y=120-ty*180; x=Math.cos(a)*rad; z=Math.sin(a)*rad*0.6; }
  else if(u<0.80) { const s=(u<0.7)?-1:1, ta=(u<0.7)?(u-0.6)/0.1:(u-0.7)/0.1; x=s*(110+ta*50)+(Math.random()-0.5)*20; y=110-ta*190+(Math.random()-0.5)*20; z=(Math.random()-0.5)*30; }
  else { const s=(u<0.9)?-1:1, tl=(u<0.9)?(u-0.8)/0.1:(u-0.9)/0.1; x=s*40+(Math.random()-0.5)*20; y=-60-tl*170+(Math.random()-0.5)*20; z=(Math.random()-0.5)*30; }
  return [x, y, z];
}

const N_NODES = 500;
N = N_NODES; T0 = new Float32Array(N*3); T1 = new Float32Array(N*3); T2 = new Float32Array(N*3); bandOf = new Uint8Array(N); const edges = [];
for(let i=0; i<N*1.5; i++) {
  const s = Math.floor(Math.random()*N), t = Math.floor(Math.random()*N);
  if(s !== t) edges.push({s, t, w: Math.random()});
}

const eu = new THREE.Euler(), q = new THREE.Quaternion();
for(let i=0; i<N; i++) {
  const R = RINGS[i%RINGS.length];
  const a = Math.random()*Math.PI*2, rr = R.r + (Math.random()-0.5)*40;
  const v = new THREE.Vector3(Math.cos(a)*rr, Math.sin(a)*rr, (Math.random()-0.5)*20);
  eu.set(R.t[0], R.t[1], R.t[2]); q.setFromEuler(eu); v.applyQuaternion(q);
  T0[i*3] = v.x; T0[i*3+1] = v.y; T0[i*3+2] = v.z;

  const th = Math.random()*Math.PI*2, pp = Math.acos(2*Math.random()-1), rOrb = SHELL * 1.05;
  T1[i*3] = rOrb*Math.sin(pp)*Math.cos(th); T1[i*3+1] = rOrb*Math.sin(pp)*Math.sin(th); T1[i*3+2] = rOrb*Math.cos(pp);
  bandOf[i] = Math.max(0, Math.min(NB-1, Math.floor((T1[i*3+1]/rOrb*0.5+0.5)*NB)));

  const h = humanoid(i,N);
  T2[i*3] = h[0]; T2[i*3+1] = h[1]; T2[i*3+2] = h[2];
}

base = new Float32Array(T1);
const pos = new Float32Array(T1), col = new Float32Array(N*3), siz = new Float32Array(N);
for(let i=0; i<N; i++) { col[i*3] = 0.23; col[i*3+1] = 1.0; col[i*3+2] = 0.58; siz[i] = 3.0 + Math.random()*5.0; }

const gp = new THREE.BufferGeometry();
gp.setAttribute('position', new THREE.BufferAttribute(pos, 3));
gp.setAttribute('acolor', new THREE.BufferAttribute(col, 3));
gp.setAttribute('asize', new THREE.BufferAttribute(siz, 1));

pts = new THREE.Points(gp, new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  uniforms: { t: {value:0}, flare: {value:0}, foc: {value: new THREE.Vector3()} },
  vertexShader: `
    attribute vec3 acolor; attribute float asize; uniform float t; uniform float flare; uniform vec3 foc;
    varying vec3 vc; varying float vf; varying float vn;
    void main(){
      vc = acolor; vec4 wp = modelMatrix * vec4(position, 1.0);
      vn = 1.0 - smoothstep(0.0, 300.0, distance(wp.xyz, foc));
      vec4 mv = viewMatrix * wp;
      // Add distance fade so it emerges beautifully from the fog
      vf = 1.0 - smoothstep(1500.0, 4500.0, -mv.z);
      gl_PointSize = asize * (400.0 / -mv.z) * (1.0 + flare*2.0 + vn*1.5);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    varying vec3 vc; varying float vf; varying float vn;
    void main(){
      vec2 d = gl_PointCoord - 0.5; float r = length(d); if(r > 0.5) discard;
      vec3 c = mix(vc, vec3(0.86, 1.0, 0.93), vn * 0.75);
      gl_FragColor = vec4(c, exp(-r*r*12.0) * vf * (0.55 + 0.75*vn));
    }`
}));
ophanim.add(pts);

const ep = new Float32Array(edges.length * 6), ea = new Float32Array(edges.length * 2);
let k = 0, k2 = 0;
for(const e of edges) {
  ep[k++] = T1[e.s*3]; ep[k++] = T1[e.s*3+1]; ep[k++] = T1[e.s*3+2];
  ep[k++] = T1[e.t*3]; ep[k++] = T1[e.t*3+1]; ep[k++] = T1[e.t*3+2];
  ea[k2++] = e.w * 0.5; ea[k2++] = e.w * 0.5;
}
const ge = new THREE.BufferGeometry();
ge.setAttribute('position', new THREE.BufferAttribute(ep, 3));
ge.setAttribute('aw', new THREE.BufferAttribute(ea, 1));
lines = new THREE.LineSegments(ge, new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `
    attribute float aw; varying float vw; varying float vf;
    void main(){
      vw=aw; vec4 mv=modelViewMatrix*vec4(position,1.);
      vf=1.-smoothstep(1000.,3500.,-mv.z);
      gl_Position=projectionMatrix*mv;
    }`,
  fragmentShader: `varying float vw; varying float vf; void main(){ gl_FragColor=vec4(0.23, 1.0, 0.58, vw*vf*0.4); }`
}));
ophanim.add(lines);

let analyser = null, bins = null, actx = null;
let LEVEL = 0, APEAK = 1e-4, HAS_AUDIO = false;

async function attachMic() {
  if (HAS_AUDIO) return;
  try {
    const st = await navigator.mediaDevices.getUserMedia({audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false}});
    actx = new (window.AudioContext || window.webkitAudioContext)();
    if(actx.state === 'suspended') await actx.resume();
    analyser = actx.createAnalyser(); analyser.fftSize = 2048; analyser.smoothingTimeConstant = 0.72;
    actx.createMediaStreamSource(st).connect(analyser);
    bins = new Uint8Array(analyser.frequencyBinCount); HAS_AUDIO = true;
  } catch(e) {
    console.warn("Microphone access denied or unavailable.");
  }
}
window.addEventListener('click', attachMic, { once: true });

function readVoice() {
  if(analyser && HAS_AUDIO) {
    analyser.getByteFrequencyData(bins);
    const M = bins.length; let sum = 0;
    for(let b=0; b<NB; b++) {
      const lo = Math.floor(Math.pow(M, b/NB)), hi = Math.max(lo+1, Math.floor(Math.pow(M, (b+1)/NB)));
      let s = 0; for(let i=lo; i<hi; i++) s += bins[i];
      BTGT[b] = s / ((hi-lo)*255); sum += BTGT[b];
    }
    let lv = sum / NB; APEAK = Math.max(APEAK * 0.9992, lv);
    const g = 1 / Math.max(APEAK, 0.045);
    for(let b=0; b<NB; b++) BTGT[b] = Math.min(1.6, BTGT[b]*g);
    lv = Math.min(1.5, lv*g); LEVEL += (lv - LEVEL) * (lv > LEVEL ? 0.55 : 0.06);
  } else {
    for(let b=0; b<NB; b++) BTGT[b] = (0.10 + 0.15*(0.5 + 0.5*Math.sin(S.time*(0.37+b*0.211)+b*1.73)) + 0.05*Math.sin(S.time*(1.7+b*0.53)+b)) * (1-b*0.055);
    const lv = 0.055 + 0.045*Math.sin(S.time*0.55) + 0.022*Math.sin(S.time*1.31+1.7);
    LEVEL += (lv - LEVEL) * 0.06;
  }
  for(let b=0; b<NB; b++) {
    BAND[b] += (BTGT[b] - BAND[b]) * (BTGT[b] > BAND[b] ? 0.55 : 0.075);
  }
}

const ring = document.getElementById('ring');
let isDragging = false, lastTouch = { x: innerWidth/2, y: innerHeight/2 };

function handleInteractionStart(e) {
  if (e.target.tagName === 'A' || e.target.closest('a')) return;
  isDragging = true;
  const x = e.touches ? e.touches[0].clientX : e.clientX, y = e.touches ? e.touches[0].clientY : e.clientY;
  lastTouch = { x, y };
  gsap.to(S, {fx: (x/innerWidth*2-1), fy: -(y/innerHeight*2-1), duration: 0.4, ease: 'power3.out', overwrite: 'auto'});
  ring.classList.add('active');
  if(navigator.vibrate) navigator.vibrate(10);
  gsap.to(S, {flare: 0.6, duration: 0.3});
}
function handleInteractionMove(e) {
  const x = e.touches ? e.touches[0].clientX : e.clientX, y = e.touches ? e.touches[0].clientY : e.clientY;
  if(!isDragging) {
    gsap.to(S, {fx: (x/innerWidth*2-1), fy: -(y/innerHeight*2-1), duration: 0.8, ease: 'power2.out', overwrite: 'auto'});
    return;
  }
  S.velX = (x - lastTouch.x) * 0.005; S.velY = (y - lastTouch.y) * 0.005;
  gsap.to(S, {fx: (x/innerWidth*2-1), fy: -(y/innerHeight*2-1), duration: 0.2, ease: 'none', overwrite: 'auto'});
  lastTouch = { x, y };
}
function handleInteractionEnd() {
  isDragging = false; ring.classList.remove('active');
  gsap.to(S, {flare: 0, duration: 1.0});
}

window.addEventListener('mousedown', handleInteractionStart, {passive: true});
window.addEventListener('mousemove', handleInteractionMove, {passive: true});
window.addEventListener('mouseup', handleInteractionEnd, {passive: true});
window.addEventListener('touchstart', handleInteractionStart, {passive: true});
window.addEventListener('touchmove', handleInteractionMove, {passive: true});
window.addEventListener('touchend', handleInteractionEnd, {passive: true});

const FORMS = ['OPHANIM','CORE','FORM'];

function shift(idx) {
  gsap.to(S, { morph: idx, duration: 2.5, ease: 'power3.inOut' });
  if(idx === 1) gsap.to(plasmaCore.scale, {x: 1, y: 1, z: 1, duration: 2, ease: 'back.out(1.2)'});
  else gsap.to(plasmaCore.scale, {x: 0.1, y: 0.1, z: 0.1, duration: 2, ease: 'power2.inOut'});
  gsap.fromTo(S, { flare: 1.0 }, { flare: 0, duration: 1.5, ease: 'power2.out' });
  if(navigator.vibrate) navigator.vibrate([15, 30, 15]);
}

window.addEventListener('dblclick', () => {
  const nextForm = (Math.round(S.morph) + 1) % 3;
  shift(nextForm);
});

const proj = new THREE.Vector3(), foc = new THREE.Vector3();

function frame() {
  requestAnimationFrame(frame); S.time += 0.016; S.drift += 0.0041;
  readVoice(); S.energy += (LEVEL - S.energy) * (LEVEL > S.energy ? 0.6 : 0.045);

  // Scroll mapping to camera depth
  const maxScroll = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
  const scrollT = window.scrollY / maxScroll;
  const targetZ = START_Z - scrollT * (START_Z - END_Z);
  S.camZ += (targetZ - S.camZ) * 0.12;

  camera.position.z = S.camZ;
  camera.position.x += ((S.fx * 70) - camera.position.x) * 0.05;
  camera.position.y += ((S.fy * 54) - camera.position.y) * 0.05;
  camera.lookAt(S.fx * 40, S.fy * 40, 0); // Keep focus centered but reactive

  S.velX *= 0.95; S.velY *= 0.95;
  ophanim.rotation.y += S.spin + S.velX; ophanim.rotation.x += S.velY;
  ophanim.rotation.z = S.rz + Math.sin(S.drift*0.9) * (0.05 + S.energy*0.06);
  ophanim.position.x += ((S.fx * 46) - ophanim.position.x) * 0.08;
  ophanim.position.y += ((S.fy * 38) - ophanim.position.y) * 0.08;
  ophanim.scale.setScalar(S.scale);

  foc.set(S.fx * 300, S.fy * 240, 120);

  if(pts && base && T0) {
    const m = S.morph, A = (m<1) ? T0 : T1, B = (m<1) ? T1 : T2, k = (m<1) ? m : m-1;
    const p = pts.geometry.attributes.position.array;
    pts.material.uniforms.foc.value.copy(foc); pts.material.uniforms.t.value = S.time; pts.material.uniforms.flare.value = S.flare;

    const orbW = Math.max(0, 1 - Math.abs(S.morph - 1)), amp = (9 + 70 * Math.min(S.energy, 1.2) + S.flare * 26) * (1 - 0.62 * orbW);
    const bandK = orbW * 0.135, breathK = orbW * (0.012 + 0.042 * Math.min(S.energy, 1.2));

    for(let i=0, n=0; i<N*3; i+=3, n++) {
      base[i] = A[i] + (B[i]-A[i])*k; base[i+1] = A[i+1] + (B[i+1]-A[i+1])*k; base[i+2] = A[i+2] + (B[i+2]-A[i+2])*k;
      const dx = base[i]-foc.x, dy = base[i+1]-foc.y, dz = base[i+2]-foc.z, d = Math.sqrt(dx*dx+dy*dy+dz*dz)+1e-4;
      const pull = amp / (1+d*0.012), w = Math.sin(S.drift*2.3+d*0.021);
      let x = base[i]-(dx/d)*pull*w, y = base[i+1]-(dy/d)*pull*w, z = base[i+2]-(dz/d)*pull*w*0.55;

      if(bandOf && bandK > 1e-4) {
        const b = bandOf[n], ring = Math.sin(S.drift*3.1+b*1.27+Math.atan2(z,x)*2.0), f = 1+BAND[b]*bandK*(0.55+0.45*ring)+breathK;
        x*=f; y*=f; z*=f;
      }
      p[i]=x; p[i+1]=y; p[i+2]=z;
    }
    pts.geometry.attributes.position.needsUpdate = true;
    if (lines) {
      const lpos = lines.geometry.attributes.position.array; let pIdx = 0;
      for(const e of edges) { lpos[pIdx++] = p[e.s*3]; lpos[pIdx++] = p[e.s*3+1]; lpos[pIdx++] = p[e.s*3+2]; lpos[pIdx++] = p[e.t*3]; lpos[pIdx++] = p[e.t*3+1]; lpos[pIdx++] = p[e.t*3+2]; }
      lines.geometry.attributes.position.needsUpdate = true;
    }
  }

  if(S.morph > 0.5 && S.morph < 1.5) {
    const cPos = coreGeometry.attributes.position.array, cBase = glassBasePositions.array, orbW = Math.max(0, 1 - Math.abs(S.morph - 1));
    for(let i=0; i<cPos.length; i+=3) {
      const bx = cBase[i], by = cBase[i+1], bz = cBase[i+2], bandIdx = Math.max(0, Math.min(NB-1, Math.floor((by / 220 * 0.5 + 0.5) * NB)));
      const disp = (BAND[bandIdx] * 40.0 * orbW) * (1 + Math.sin(bx*0.02+S.time)*Math.cos(by*0.02+S.time)*Math.sin(bz*0.02+S.time));
      const len = Math.sqrt(bx*bx+by*by+bz*bz);
      cPos[i] = bx+(bx/len*disp); cPos[i+1] = by+(by/len*disp); cPos[i+2] = bz+(bz/len*disp);
    }
    coreGeometry.attributes.position.needsUpdate = true;
  } else coreGeometry.setAttribute('position', glassBasePositions.clone());

  if(plasmaMaterial) { plasmaMaterial.uniforms.t.value = S.time; plasmaMaterial.uniforms.energy.value = S.energy; plasmaMaterial.uniforms.morph.value = S.morph; }
  if(world) world.material.uniforms.t.value = S.time;
  plasmaCore.rotation.y = -S.time * 0.4; plasmaCore.rotation.x = S.time * 0.2;
  bloomPass.strength = 0.8 + Math.min(S.energy, 1.5) * 0.5 + S.flare * 0.8;

  // Process 3D CSS Cards logic (Depth fog & Blur)
  cards.forEach(obj => {
      const dist = camera.position.z - obj.position.z;
      let op = 1, blur = 0;

      // Far clip
      if (dist > 1800) { op = 1 - (dist - 1800) / 800; blur = (dist - 1800) * 0.005; }
      // Near clip
      else if (dist < 100) { op = dist / 100; blur = (100 - dist) * 0.05; }

      op = Math.max(0, Math.min(1, op));
      obj.element.style.opacity = op.toFixed(3);
      obj.element.style.filter = blur > 0.1 ? `blur(${blur}px)` : 'none';
      obj.element.style.visibility = op > 0.01 ? 'visible' : 'hidden';
  });

  composer.render();
  cssRenderer.render(cssScene, camera);
}
frame();

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
  cssRenderer.setSize(innerWidth, innerHeight);
});

setTimeout(async () => {
    const links = Array.from(document.querySelectorAll('.card-link'));
    let scanIdx = 0;
    while(scanIdx < links.length) {
        const batch = links.slice(scanIdx, scanIdx + 5);
        await Promise.all(batch.map(async el => {
            try {
                await fetch(el.href, { mode: 'no-cors', cache: 'no-store' });
                el.classList.add('up');
            } catch(e) {
                el.classList.add('down');
            }
        }));
        scanIdx += 5;
        await new Promise(r => setTimeout(r, 100));
    }
}, 3000);
</script>
</body>
