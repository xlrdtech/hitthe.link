<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="robots" content="noindex,nofollow"/>
  <meta name="theme-color" content="#000200"/>
  <meta name="color-scheme" content="dark"/>
  <title>XENOS Omni</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@100;300;400&display=swap" rel="stylesheet"/>

  <style>
    :root {
      --ink: #dffbe9;
      --accent: #3cff96;
      --alert: #ff4a4a;
      --dim: rgba(223, 251, 233, 0.45);
      --faint: rgba(223, 251, 233, 0.12);
      --glass: rgba(0, 4, 0, 0.65);
      --bg: #000200;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      min-height: 100%;
      background: var(--bg);
      overflow-x: hidden;
      overflow-y: auto;
      touch-action: pan-y; /* Allow vertical scroll on mobile */
      font-family: 'Inter', sans-serif;
      cursor: crosshair;
    }
    body::-webkit-scrollbar { display: none; }

    canvas { display: block; position: fixed; inset: 0; outline: none; z-index: 0; }

    #ring {
      position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
      width: min(85vmin, 800px); aspect-ratio: 1; border-radius: 50%;
      border: 1px solid var(--faint);
      box-shadow: 0 0 140px rgba(94, 255, 168, 0.03) inset; pointer-events: none; z-index: 2;
      transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #ring.active { transform: translate(-50%,-50%) scale(0.95); border-color: var(--dim); box-shadow: 0 0 160px rgba(94, 255, 168, 0.08) inset; }

    .crosshair { position: fixed; left: 50%; top: 50%; width: 2px; height: 2px; background: var(--accent); transform: translate(-50%, -50%); border-radius: 50%; opacity: 0.5; z-index: 2; pointer-events: none; }
    .crosshair::before, .crosshair::after { content: ''; position: absolute; background: var(--faint); }
    .crosshair::before { width: 40px; height: 1px; left: -19px; top: 0; }
    .crosshair::after { width: 1px; height: 40px; left: 0; top: -19px; }

    .card-3d {
      width: 480px;
      background: rgba(0, 4, 0, 0.65);
      border: 1px solid rgba(94, 255, 168, 0.15);
      border-radius: 12px;
      padding: 32px;
      color: var(--ink);
      font-family: 'JetBrains Mono', monospace;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.9), 0 0 0 1px rgba(94, 255, 168, 0.05) inset;
      will-change: transform, opacity, filter;
    }
    .card-3d.ident-card {
      width: 700px;
      text-align: center;
      background: transparent;
      border: none;
      box-shadow: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .ident-card .mark {
      font-size: 110px;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      letter-spacing: -0.05em;
      color: var(--ink);
      line-height: 0.9;
      margin: 20px 0;
      text-shadow: 0 0 40px rgba(94, 255, 168, 0.15);
    }
    .ident-card .cap { font-size: 12px; letter-spacing: 0.25em; color: var(--accent); }

    .card-3d h2 {
      font-size: 22px;
      color: var(--accent);
      margin-bottom: 24px;
      font-weight: 300;
      border-bottom: 1px solid var(--faint);
      padding-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
    }
    .card-link {
      display: block;
      position: relative;
      padding: 10px 12px 10px 24px;
      background: rgba(94, 255, 168, 0.03);
      border: 1px solid rgba(94, 255, 168, 0.1);
      border-radius: 6px;
      color: var(--dim);
      text-decoration: none;
      font-size: 11px;
      letter-spacing: 0.05em;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-link::before {
      content: ''; position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
      width: 4px; height: 4px; border-radius: 50%; background: var(--dim);
      transition: all 0.3s ease;
    }
    .card-link:hover { background: rgba(94, 255, 168, 0.15); color: var(--ink); border-color: var(--accent); box-shadow: 0 0 15px rgba(94, 255, 168, 0.15); }
    .card-link:hover::before { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
    .card-link.up { color: var(--ink); border-color: rgba(94, 255, 168, 0.3); }
    .card-link.up::before { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
    .card-link.down { color: var(--faint); opacity: 0.6; }
    .card-link.down::before { background: var(--alert); box-shadow: 0 0 8px var(--alert); }

    @media (max-width: 768px) {
      #ring { width: 95vmin; }
      .card-3d { width: 340px; padding: 24px; }
      .ident-card .mark { font-size: 64px; }
    }

    /* ==================================================================
       OMNI INBOX -- the product layer. The XENOS scene stays the ground
       (canvas z-index 0, CSS3D z-index 1, ring/crosshair z-index 2).
       This sits at z-index 10: fully on, readable, scrollable, replyable.
       cursor is an inherited property, so #omni alone re-bases it away
       from the page-wide crosshair -- do NOT add a "#omni *" rule, its
       id-weighted specificity would beat every .omni-* cursor below.
       ================================================================== */
    #omni {
      --oj: #00ff44;                     /* qi jade */
      position: fixed; z-index: 10;
      right: 0; top: 0; bottom: 0;
      width: clamp(330px, 33vw, 470px);
      display: flex; flex-direction: column;
      color: var(--ink);
      font-family: 'Inter', system-ui, sans-serif;
      background:
        linear-gradient(180deg, rgba(0,10,4,0.90) 0%, rgba(0,4,1,0.80) 40%, rgba(0,3,1,0.88) 100%);
      backdrop-filter: blur(20px) saturate(1.35);
      -webkit-backdrop-filter: blur(20px) saturate(1.35);
      border-left: 1px solid rgba(0, 255, 68, 0.20);
      box-shadow: -24px 0 70px rgba(0,0,0,0.75), 1px 0 0 rgba(0,255,68,0.06) inset;
      cursor: default;
      overscroll-behavior: contain;
      padding-top: env(safe-area-inset-top, 0px);
      padding-right: env(safe-area-inset-right, 0px);
    }

    /* ---- header ---- */
    #omni-head {
      flex: 0 0 auto; padding: 14px 14px 10px;
      border-bottom: 1px solid rgba(0,255,68,0.14);
      background: rgba(0,0,0,0.30);
    }
    .omni-title { display: flex; align-items: center; gap: 10px; }
    .omni-name {
      font-weight: 600; font-size: 15px; letter-spacing: 0.22em;
      color: var(--ink); margin-right: auto;
    }
    .omni-live {
      display: inline-flex; align-items: center; gap: 6px;
      font-family: 'JetBrains Mono', monospace; font-size: 9.5px;
      letter-spacing: 0.16em; padding: 4px 8px; border-radius: 999px;
      border: 1px solid rgba(223,251,233,0.16); color: var(--dim);
      background: rgba(0,0,0,0.35); white-space: nowrap;
    }
    .omni-live i { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); flex: 0 0 auto; }
    .omni-live[data-state="live"] { color: var(--oj); border-color: rgba(0,255,68,0.55); }
    .omni-live[data-state="live"] i { background: var(--oj); box-shadow: 0 0 10px var(--oj); animation: omni-beat 1.1s ease-in-out infinite; }
    .omni-live[data-state="ok"]   { color: #7fe0a4; border-color: rgba(0,255,68,0.26); }
    .omni-live[data-state="ok"] i { background: #7fe0a4; box-shadow: 0 0 6px rgba(0,255,68,0.5); }
    .omni-live[data-state="lag"]  { color: #ffc24a; border-color: rgba(255,194,74,0.45); }
    .omni-live[data-state="lag"] i { background: #ffc24a; box-shadow: 0 0 8px #ffc24a; }
    .omni-live[data-state="dead"] { color: var(--alert); border-color: rgba(255,74,74,0.55); }
    .omni-live[data-state="dead"] i { background: var(--alert); box-shadow: 0 0 10px var(--alert); animation: omni-beat 0.7s steps(2) infinite; }
    @keyframes omni-beat { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }

    .omni-btn {
      -webkit-appearance: none; appearance: none;
      min-width: 44px; min-height: 34px; padding: 4px 10px;
      background: rgba(0,255,68,0.06); color: var(--dim);
      border: 1px solid rgba(0,255,68,0.16); border-radius: 8px;
      font-family: 'JetBrains Mono', monospace; font-size: 14px; line-height: 1;
      cursor: pointer; transition: all 0.2s ease; touch-action: manipulation;
    }
    .omni-btn:hover { color: var(--oj); border-color: rgba(0,255,68,0.5); background: rgba(0,255,68,0.14); }

    .omni-stat {
      margin-top: 8px; font-family: 'JetBrains Mono', monospace;
      font-size: 10px; letter-spacing: 0.05em; color: var(--dim);
      line-height: 1.5; word-break: break-word;
    }
    .omni-stat.err { color: var(--alert); }

    .omni-nets { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
    .omni-chip {
      -webkit-appearance: none; appearance: none;
      display: inline-flex; align-items: baseline; gap: 5px;
      padding: 6px 8px; border-radius: 7px;
      background: rgba(223,251,233,0.04);
      border: 1px solid rgba(223,251,233,0.10);
      color: var(--dim); font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px; letter-spacing: 0.1em; cursor: pointer;
      transition: all 0.2s ease; touch-action: manipulation;
    }
    .omni-chip b { font-weight: 400; color: var(--ink); font-size: 10.5px; }
    .omni-chip:hover { border-color: rgba(0,255,68,0.4); }
    .omni-chip[aria-pressed="true"] { background: rgba(0,255,68,0.13); border-color: var(--oj); }
    .omni-chip[aria-pressed="true"] b { color: var(--oj); }

    .omni-q {
      -webkit-appearance: none; appearance: none;
      width: 100%; margin-top: 10px; min-height: 44px; padding: 10px 12px;
      background: rgba(0,0,0,0.45); color: var(--ink);
      border: 1px solid rgba(223,251,233,0.14); border-radius: 9px;
      font-family: 'JetBrains Mono', monospace; font-size: 12px;
      letter-spacing: 0.04em; cursor: text;
    }
    .omni-q::placeholder { color: rgba(223,251,233,0.30); }
    .omni-q:focus { outline: none; border-color: rgba(0,255,68,0.55); box-shadow: 0 0 0 3px rgba(0,255,68,0.10); }

    /* ---- river ---- */
    .omni-river {
      flex: 1 1 auto; min-height: 0;
      overflow-y: auto; overflow-x: hidden;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      scrollbar-width: thin; scrollbar-color: rgba(0,255,68,0.25) transparent;
    }
    .omni-river::-webkit-scrollbar { width: 6px; }
    .omni-river::-webkit-scrollbar-thumb { background: rgba(0,255,68,0.22); border-radius: 3px; }

    .omni-row {
      -webkit-appearance: none; appearance: none;
      display: block; width: 100%; min-height: 56px;
      text-align: left; background: transparent; color: inherit;
      border: 0; border-bottom: 1px solid rgba(223,251,233,0.07);
      border-left: 2px solid transparent;
      padding: 11px 14px 12px; cursor: pointer; font: inherit;
      transition: background 0.18s ease, border-color 0.18s ease;
      touch-action: manipulation;
    }
    .omni-row:hover { background: rgba(0,255,68,0.055); }
    .omni-row.unread { border-left-color: rgba(0,255,68,0.55); background: rgba(0,255,68,0.035); }
    .omni-row.unread .omni-rt { color: rgba(223,251,233,0.92); }
    .omni-row.unread .omni-who { color: var(--oj); }
    .omni-row.sel { background: rgba(0,255,68,0.10); border-left-color: var(--oj); }
    .omni-row.out { opacity: 0.8; }
    .omni-row.pending { opacity: 0.55; }
    .omni-row.failed { border-left-color: var(--alert); opacity: 1; }

    .omni-rh { display: flex; align-items: center; gap: 7px; margin-bottom: 5px; }
    .omni-badge {
      flex: 0 0 auto; min-width: 30px; text-align: center;
      padding: 2px 5px; border-radius: 5px;
      font-family: 'JetBrains Mono', monospace; font-size: 8.5px;
      letter-spacing: 0.08em; border: 1px solid currentColor; opacity: 0.9;
    }
    .omni-who {
      font-size: 12px; font-weight: 600; color: var(--ink);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 46%;
    }
    .omni-where {
      font-family: 'JetBrains Mono', monospace; font-size: 9.5px; color: var(--dim);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1 1 auto;
    }
    .omni-when {
      flex: 0 0 auto; font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px; color: var(--dim); letter-spacing: 0.04em;
    }
    .omni-rt {
      font-size: 12.5px; line-height: 1.45; color: rgba(223,251,233,0.72);
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
      overflow: hidden; word-break: break-word; white-space: pre-wrap;
    }
    .omni-tag {
      font-family: 'JetBrains Mono', monospace; font-size: 8.5px;
      letter-spacing: 0.1em; color: var(--oj); opacity: 0.9; margin-right: 5px;
    }
    .omni-empty {
      padding: 26px 16px; color: var(--dim); white-space: pre-line;
      font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 1.75;
      text-align: center;
    }
    .omni-empty.err { color: var(--alert); text-align: left; word-break: break-word; }

    /* ---- composer ---- */
    .omni-composer {
      flex: 0 0 auto; border-top: 1px solid rgba(0,255,68,0.22);
      background: rgba(0,0,0,0.55); padding: 10px 12px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom, 10px));
    }
    .omni-composer[hidden] { display: none; }
    .omni-to {
      display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
      font-family: 'JetBrains Mono', monospace; font-size: 10px;
      letter-spacing: 0.08em; color: var(--oj);
    }
    .omni-to span { flex: 1 1 auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .omni-crow { display: flex; gap: 8px; align-items: flex-end; }
    #omni-text {
      -webkit-appearance: none; appearance: none;
      flex: 1 1 auto; min-height: 44px; max-height: 132px; resize: none;
      padding: 12px; border-radius: 9px;
      background: rgba(0,0,0,0.5); color: var(--ink);
      border: 1px solid rgba(0,255,68,0.28);
      font-family: 'Inter', sans-serif; font-size: 13px; line-height: 1.4;
      cursor: text;
    }
    #omni-text:focus { outline: none; border-color: var(--oj); box-shadow: 0 0 0 3px rgba(0,255,68,0.12); }
    .omni-send {
      -webkit-appearance: none; appearance: none;
      flex: 0 0 auto; min-width: 62px; min-height: 44px; padding: 0 14px;
      background: rgba(0,255,68,0.14); color: var(--oj);
      border: 1px solid var(--oj); border-radius: 9px;
      font-family: 'JetBrains Mono', monospace; font-size: 10.5px;
      letter-spacing: 0.14em; cursor: pointer; transition: all 0.2s ease;
      touch-action: manipulation;
    }
    .omni-send:hover { background: rgba(0,255,68,0.28); }
    .omni-send:disabled { opacity: 0.4; cursor: default; }
    .omni-err {
      margin-top: 8px; color: var(--alert);
      font-family: 'JetBrains Mono', monospace; font-size: 10px;
      line-height: 1.5; word-break: break-word;
    }
    .omni-err[hidden] { display: none; }

    /* ---- collapsed: header only, inbox stays reachable in one tap ---- */
    #omni.min { top: auto; bottom: 0; height: auto; }
    #omni.min .omni-river, #omni.min .omni-composer,
    #omni.min .omni-nets, #omni.min .omni-q { display: none; }
    #omni.min #omni-head { border-bottom: 0; }

    /* ---- handset: bottom sheet, the scene breathes above it ---- */
    @media (max-width: 820px) {
      #omni {
        left: 0; right: 0; top: auto; bottom: 0;
        width: auto; height: min(76vh, calc(100% - 54px));
        border-left: 0; border-top: 1px solid rgba(0,255,68,0.28);
        border-radius: 16px 16px 0 0;
        box-shadow: 0 -22px 60px rgba(0,0,0,0.8);
        padding-top: 0; padding-left: env(safe-area-inset-left, 0px);
      }
      #omni-head { padding: 12px 12px 9px; }
      .omni-name { font-size: 13px; letter-spacing: 0.18em; }
      .omni-row { padding: 12px 12px 13px; }
      .omni-rt { -webkit-line-clamp: 2; }
      /* thumb-sized targets -- measured 28px chip / 34px button before this block */
      .omni-chip { min-height: 44px; padding: 6px 11px; font-size: 10px; }
      .omni-chip b { font-size: 12px; }
      .omni-btn { min-height: 44px; min-width: 44px; }
      .omni-nets { gap: 6px; }
    }
  </style>
</head>
<body>

<div id="scroll-track" style="position: absolute; top: 0; left: 0; width: 1px; pointer-events: none; z-index: -1;"></div>

<div id="ring"></div><div class="crosshair"></div>

<!-- ==================== OMNI INBOX (live) ==================== -->
<section id="omni" aria-label="Omni inbox">
  <header id="omni-head">
    <div class="omni-title">
      <span id="omni-live" class="omni-live" data-state="boot"><i></i><b>OPENING</b></span>
      <span class="omni-name">OMNI</span>
      <button id="omni-min" class="omni-btn" type="button" title="Collapse" aria-label="Collapse inbox">&#8722;</button>
    </div>
    <div id="omni-stat" class="omni-stat">opening rail &#183; omni.xlrd.org</div>
    <div id="omni-nets" class="omni-nets"></div>
    <input id="omni-q" class="omni-q" type="search" inputmode="search" autocomplete="off"
           spellcheck="false" placeholder="filter &#183; sender, text, network" aria-label="Filter messages"/>
  </header>

  <div id="omni-river" class="omni-river" role="log" aria-live="polite" aria-label="Message river">
    <div class="omni-empty">reading the rail&#8230;</div>
  </div>

  <form id="omni-composer" class="omni-composer" hidden>
    <div class="omni-to">
      <span id="omni-to-name"></span>
      <button id="omni-close" class="omni-btn" type="button" title="Close composer" aria-label="Close composer">&#10005;</button>
    </div>
    <div class="omni-crow">
      <textarea id="omni-text" rows="1" placeholder="reply&#8230;  (enter sends)" aria-label="Reply text"></textarea>
      <button id="omni-send" class="omni-send" type="submit">SEND</button>
    </div>
    <div id="omni-err" class="omni-err" hidden></div>
  </form>
</section>
<!-- ==================== /OMNI INBOX ==================== -->

async function attachMic() {
  if (HAS_AUDIO) return;
  try {
    const st = await navigator.mediaDevices.getUserMedia({audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false}});
    actx = new (window.AudioContext || window.webkitAudioContext)();

function readVoice() {
  if(analyser && HAS_AUDIO) {
    analyser.getByteFrequencyData(bins);
    const M = bins.length; let sum = 0;
    for(let b=0; b<NB; b++) {
      const lo = Math.floor(Math.pow(M, b/NB)), hi = Math.max(lo+1, Math.floor(Math.pow(M, (b+1)/NB)));

    LEVEL += (lv - LEVEL) * 0.06;
  }

    BAND[b] += (BTGT[b] - BAND[b]) * (BTGT[b] > BAND[b] ? 0.55 : 0.075);

                          map below is local, which is why it is defined here)

                          re-pushed on change. Used as the CHANGE TRIGGER, not as the data.

   interval is the safety net under both. Nothing on screen is asserted without a

    linkedin:  { l: 'LinkedIn',  i: 'LI',  c: '#4d94d6' },
    email:     { l: 'Email',     i: 'EM',  c: '#00ff44' },

    var out = [], i, m, hay;
    for (i = 0; i < order.length; i++) {
      m = msgs[order[i]];
      if (!m) continue;
      if (filterNet && m.network !== filterNet) continue;
      if (filterTxt) {
        hay = (String(m.sender || '') + ' ' + String(m.title || '') + ' ' +
               String(m.text || '') + ' ' + String(m.network || '') + ' ' +
               String(m.account || '')).toLowerCase();
        if (hay.indexOf(filterTxt) < 0) continue;
      }
      out.push(m);
    }
    out.sort(function (a, b) { return (b.ts || 0) - (a.ts || 0); });
    return out.length > MAX_ROWS ? out.slice(0, MAX_ROWS) : out;
  }

  function render() {
    var rows = visible(), i, sig = [];
    for (i = 0; i < rows.length; i++) {
      sig.push(keyOf(rows[i]) + (rows[i].pending ? '!p' : '') + (rows[i].failed ? '!f' : '') +
               (rows[i].unread ? '!u' : ''));
    }
    var s = filterNet + '|' + filterTxt + '|' + (active ? active.roomId : '') + '|' +
            lastErr + '|' + sig.join(',');
    if (s === lastSig) { refreshTimes(); return; }   /* idle poll -> zero DOM churn */
    lastSig = s;

    var atTop = elRiver.scrollTop < 8;
    elRiver.textContent = '';
    renderedTs = [];

    if (!rows.length) {
      var e = document.createElement('div');
      e.className = 'omni-empty' + (lastErr ? ' err' : '');
      if (lastErr) {
        e.textContent = 'the rail is not answering.\n' + lastErr +
                        '\n\nretrying on its own. nothing here is cached or invented.';
      } else if (!lastOkAt) {
        e.textContent = 'reading the rail\u2026';
      } else if (filterNet || filterTxt) {
        e.textContent = 'no loaded message matches that filter.' +
          (filterNet ? ('\n' + netOf(filterNet).l + ': the rail byNet reports ' + (byNet[filterNet] || 0) + '.') : '');
      } else {
        e.textContent = 'the rail answered with zero messages.';
      }
      elRiver.appendChild(e);
      return;
    }

    var frag = document.createDocumentFragment();
    for (i = 0; i < rows.length; i++) { frag.appendChild(row(rows[i])); renderedTs.push(rows[i].ts); }
    elRiver.appendChild(frag);
    if (atTop) elRiver.scrollTop = 0;
  }

  function row(m) {
    var info = netOf(m.network);
    var outb = !!(m.outbound || m.direction === 'out');
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'omni-row' +
      (m.unread && !outb ? ' unread' : '') +
      (outb ? ' out' : '') +
      (m.pending ? ' pending' : '') +
      (m.failed ? ' failed' : '') +
      (active && active.roomId === m.roomId ? ' sel' : '');
    b.setAttribute('data-key', keyOf(m));

    var h = document.createElement('div'); h.className = 'omni-rh';

    var bg = document.createElement('span');
    bg.className = 'omni-badge'; bg.style.color = info.c; bg.textContent = info.i;
    h.appendChild(bg);

    var who = document.createElement('span');
    who.className = 'omni-who';
    who.textContent = outb ? 'you' : String(m.sender || 'unknown');
    h.appendChild(who);

    var where = document.createElement('span');
    where.className = 'omni-where';
    var wt = String(m.title || '');
    /* a matrix room id is not a thread name -- show nothing rather than noise */
    if (/^!\S+:\S+$/.test(wt) || /^@\S+:\S+$/.test(wt)) wt = '';
    where.textContent = (wt && wt !== String(m.sender || '')) ? wt : '';
    h.appendChild(where);

    var when = document.createElement('span');
    when.className = 'omni-when'; when.textContent = rel(m.ts);
    h.appendChild(when);

    b.appendChild(h);

    var t = document.createElement('div'); t.className = 'omni-rt';
    if (m.pending || m.failed || m.unconfirmed) {
      var tg = document.createElement('span'); tg.className = 'omni-tag';
      if (m.pending)        { tg.textContent = 'SENDING'; }
      else if (m.failed)    { tg.textContent = 'NOT SENT'; tg.style.color = 'var(--alert)'; }
      else                  { tg.textContent = 'SENT'; tg.title = 'accepted by /api/reply, not yet echoed back by the rail'; }
      t.appendChild(tg);
    }
    t.appendChild(document.createTextNode(
      String(m.text || '').length ? String(m.text)
        : (m.encrypted && !m.decrypted ? '[encrypted \u2014 no cleartext on the rail]' : '[no text]')
    ));
    b.appendChild(t);
    return b;
  }

  /* ---------------- composer ---------------- */
  function openComposer(m) {
    var nm = String(m.title || '');
    if (!nm || /^[!@]\S+:\S+$/.test(nm)) nm = String(m.sender || '') || String(m.roomId);
    active = { roomId: m.roomId, title: nm, network: m.network };
    elTo.textContent = 'reply \u2192 ' + active.title + '  [' + netOf(m.network).l + ']';
    elErr.hidden = true; elErr.textContent = '';
    elComp.hidden = false;
    render(); autoGrow(); elText.focus();
  }
  function closeComposer() {
    active = null; elComp.hidden = true; elText.value = ''; render();
  }
  function autoGrow() {
    elText.style.height = 'auto';
    elText.style.height = Math.min(elText.scrollHeight, 132) + 'px';
  }

  function send() {
    if (!active) return;
    var text = elText.value.trim();
    if (!text) return;
    var room = active.roomId, title = active.title, netw = active.network;

    var echoKey = 'local:' + room + ':' + Date.now();
    msgs[echoKey] = {
      roomId: room, title: title, network: netw, sender: 'you',
      ts: Date.now(), text: text, unread: false, outbound: true,
      direction: 'out', source: 'local-echo', pending: true
    };
    order.push(echoKey);
    elText.value = ''; autoGrow();
    elErr.hidden = true; elErr.textContent = '';
    elSend.disabled = true;
    render();

    var rac = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    var rhung = false;
    var rkill = setTimeout(function () { rhung = true; if (rac) rac.abort(); }, 15000);

    fetch(REPLY, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      cache: 'no-store', credentials: 'omit',
      signal: rac ? rac.signal : undefined,
      body: JSON.stringify({ roomId: room, text: text })
    })
      .then(function (r) {
        return r.text().then(function (body) {
          var d = null;
          try { d = JSON.parse(body); } catch (e) {}
          /* a 200 is not proof -- assert on the body */
          if (!r.ok || !d || d.ok !== true) {
            throw new Error('HTTP ' + r.status + ' \u00b7 ' +
              ((d && d.error) ? d.error : (body.slice(0, 160) || 'empty body')));
          }
          return d;
        });
      })
      .then(function () {
        if (msgs[echoKey]) { msgs[echoKey].pending = false; msgs[echoKey].unconfirmed = true; }
        setTimeout(pull, 700);
        setTimeout(pull, 2600);
      })
      .catch(function (e) {
        if (msgs[echoKey]) { msgs[echoKey].pending = false; msgs[echoKey].failed = true; }
        elErr.textContent = 'send failed: ' +
          (rhung ? '/api/reply did not answer within 15s -- unknown whether it sent'
                 : ((e && e.message) ? e.message : String(e)));
        elErr.hidden = false;
        elText.value = text; autoGrow();
      })
      .then(function () { clearTimeout(rkill); elSend.disabled = false; render(); });
  }

  /* ---------------- wiring ---------------- */
  elRiver.addEventListener('click', function (ev) {
    var t = ev.target;
    while (t && t !== elRiver && !(t.classList && t.classList.contains('omni-row'))) t = t.parentNode;
    if (!t || t === elRiver) return;
    var m = msgs[t.getAttribute('data-key')];
    if (m) openComposer(m);
  });

  elNets.addEventListener('click', function (ev) {
    var t = ev.target;
    while (t && t !== elNets && !(t.classList && t.classList.contains('omni-chip'))) t = t.parentNode;
    if (!t || t === elNets) return;
    var n = t.getAttribute('data-net') || '';
    filterNet = (filterNet === n) ? '' : n;
    renderNets(); render();
  });

  elQ.addEventListener('input', function () { filterTxt = elQ.value.trim().toLowerCase(); render(); });
  elComp.addEventListener('submit', function (ev) { ev.preventDefault(); send(); });
  elClose.addEventListener('click', closeComposer);
  elText.addEventListener('input', autoGrow);
  elText.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); send(); }
    else if (ev.key === 'Escape') closeComposer();
  });
  elMin.addEventListener('click', function () {
    var min = elPanel.classList.toggle('min');
    elMin.innerHTML = min ? '&#43;' : '&#8722;';
    elMin.title = min ? 'Expand' : 'Collapse';
  });

  /* Keep panel gestures out of the scene's window-level drag/parallax handlers.
     Bubble phase ONLY -- a capture-phase stop would starve the panel's own
     buttons before they ever see the event. */
  ['mousedown', 'mousemove', 'mouseup', 'touchstart', 'touchmove', 'touchend',
   'click', 'dblclick', 'wheel'].forEach(function (evt) {
    elPanel.addEventListener(evt, function (ev) { ev.stopPropagation(); });
  });

  /* Live by default: the API paints before the first frame, SSE right behind it,
     an 8s net under both, and an instant pull whenever the tab or network returns. */
  pull();
  openSSE();
  setInterval(pull, POLL_MS);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) {
      pull();
      if (!es || es.readyState === 2) { esTries = 0; openSSE(); }
    }
  });
  window.addEventListener('online', function () { esTries = 0; openSSE(); pull(); });
  window.addEventListener('focus', pull);

  /* verification surface -- read this, do not infer from the screen */
  window.OMNI = {
    stats: function () {
      return {
        loaded: order.length, apiTotal: apiTotal, byNet: byNet, sse: sseState,
        lastOkSecs: secsSince(lastOkAt), lastNewSecs: secsSince(lastNewAt),
        lastErr: lastErr, rows: elRiver.children.length,
        state: elLive.getAttribute('data-state'), label: elLive.lastChild.textContent
      };
    },
    pull: pull
  };
})();
</script>
</body>

</html>
