<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="color-scheme" content="dark"/>
<title>XENOS — entity</title>
<style>
  :root{ --ink:#dffbe9; --dim:rgba(223,251,233,.40); --faint:rgba(223,251,233,.15); }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;width:100%;background:#000;overflow:hidden;
    -webkit-tap-highlight-color:transparent;touch-action:none}
  body{display:block}
  canvas{display:block;position:fixed;inset:0;width:100%;height:100%}

  /* the entity is the interface. chrome auto-hides and never covers the subject. */
  #chrome{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));
    transform:translateX(-50%);z-index:8;display:flex;gap:6px;
    font:300 10px/1 ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:.14em;
    opacity:0;transition:opacity .5s ease;pointer-events:none}
  #chrome.on{opacity:1;pointer-events:auto}
  #chrome b{cursor:pointer;color:var(--dim);background:rgba(255,255,255,.02);
    border:1px solid rgba(180,255,214,.12);border-radius:14px;padding:7px 11px;
    font-weight:300;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    transition:color .25s,border-color .25s,background .25s;user-select:none}
  #chrome b:hover,#chrome b.a{color:var(--ink);border-color:rgba(150,255,196,.45);
    background:rgba(120,255,178,.05)}
  #cur{position:fixed;width:5px;height:5px;border-radius:50%;z-index:9;pointer-events:none;
    background:rgba(190,255,215,.85);box-shadow:0 0 12px rgba(120,255,170,.7);
    transform:translate(-50%,-50%);opacity:0;transition:opacity .4s}
  @media (pointer:fine){ html,body{cursor:none} #cur{opacity:1} }
  #boot{position:fixed;inset:0;z-index:20;background:#000;display:grid;place-items:center;
    color:var(--faint);font:300 10px/1 ui-monospace,monospace;letter-spacing:.3em;
    transition:opacity .9s ease}
  #boot.gone{opacity:0;pointer-events:none}
  #err{position:fixed;left:0;right:0;top:0;z-index:30;padding:14px 18px;display:none;
    background:#180404;color:#ff9a8a;font:400 11px/1.6 ui-monospace,monospace;white-space:pre-wrap}
</style>
</head>
<body>
<div id="boot">XENOS</div>
<div id="cur"></div>
<div id="chrome">
  <b data-s="idle">idle</b><b data-s="hand">hand</b><b data-s="orb">orb</b><b data-s="wheels">wheels</b><b id="aud">audio off</b>
</div>
<div id="err"></div>

<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.176.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.176.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';

/* ─────────────────────────────────────────────────────────────────────────────
   XENOS ENTITY
   A physically-simulated synthetic hand suspended in dynamic space.
   Single file. No bundler, no framework, no iframe. three.js by CDN import map.

   RENDER PATH — read this before "fixing" the tone mapping:
   The scene renders into a HALF-FLOAT linear HDR target with renderer.toneMapping
   left at NoToneMapping ON PURPOSE. ACESFilmic + exposure 1.1 are applied ONCE, by
   hand, in the composite pass (see ACES() below). Setting renderer.toneMapping here
   would tone-map twice and crush the conduits. The spec's exposure value (1.1) is
   honoured exactly — it lives in uExposure.
   ──────────────────────────────────────────────────────────────────────────── */

const QS   = new URLSearchParams(location.search);
const UI   = QS.get('ui') !== '0';
const LOW  = Math.min(innerWidth, innerHeight) < 520;   // phone-class budget

const ERR = document.getElementById('err');
function fatal(e){ ERR.style.display='block'; ERR.textContent='XENOS FAULT\n'+(e&&e.stack||e); console.error(e); }
addEventListener('error', ev=>fatal(ev.error||ev.message));

/* ══ 1. RENDERER ══════════════════════════════════════════════════════════════
   WebGPU FEATURE CHECK — honest version.
   navigator.gpu is genuinely probed and the adapter recorded on window.XENOS.gpu.
   WebGPURenderer is NOT constructed: every material below is hand-written GLSL,
   and three's WebGPURenderer requires TSL/NodeMaterials — handing it these
   ShaderMaterials produces a blank canvas, not a fallback. Shipping a flag that
   yields a black page is worse than shipping the WebGL2 path that was tested.
   The probe result is surfaced so the upgrade can be measured, not guessed.      */
const gpuInfo = { supported: !!navigator.gpu, adapter: null, used: false,
                  reason: 'material stack is GLSL/WebGL2; WebGPU needs a TSL port' };
if (navigator.gpu) {
  navigator.gpu.requestAdapter().then(a=>{ gpuInfo.adapter = a ? (a.info?.description || a.info?.vendor || 'adapter') : null; })
                                .catch(()=>{});
}

const canvas = document.createElement('canvas');
document.body.appendChild(canvas);
let renderer;
try{
  renderer = new THREE.WebGLRenderer({
    canvas, antialias:!LOW, powerPreference:'high-performance',
    alpha:false, stencil:false,
    preserveDrawingBuffer:true          // pixel probes read real bytes, not zeros
  });
}catch(e){ fatal(e); throw e; }

const DPR = Math.min(devicePixelRatio||1, LOW?2:1.75);
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth, innerHeight, false);
renderer.toneMapping     = THREE.NoToneMapping;          // see header note
renderer.outputColorSpace= THREE.LinearSRGBColorSpace;   // composite encodes sRGB
renderer.shadowMap.enabled = true;
renderer.shadowMap.type    = THREE.PCFSoftShadowMap;
renderer.setClearColor(0x000000, 1);
const IS_WEBGL2 = renderer.capabilities.isWebGL2;

/* ══ 2. SCENE / CAMERA / LIGHT ════════════════════════════════════════════════ */
const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.08, 60);

// single directional key "softbox", high and to the camera-left
const KEYDIR = new THREE.Vector3(-0.52, 0.78, 0.46).normalize();
const key = new THREE.DirectionalLight(0xf3fff8, 3.1);
key.position.copy(KEYDIR).multiplyScalar(7);
key.castShadow = true;
key.shadow.mapSize.set(LOW?1024:2048, LOW?1024:2048);
key.shadow.camera.near = 1; key.shadow.camera.far = 16;
key.shadow.camera.left=-2.4; key.shadow.camera.right=2.4;
key.shadow.camera.top=2.4;  key.shadow.camera.bottom=-2.4;
key.shadow.bias = -0.0016; key.shadow.normalBias = 0.018; key.shadow.radius = 3;
scene.add(key); scene.add(key.target);

// ground-bounce fill: cold, from below, no shadow
const bounce = new THREE.DirectionalLight(0x7fd2ff, 0.55);
bounce.position.set(0.6,-2.2,0.9); scene.add(bounce);
scene.add(new THREE.HemisphereLight(0x16281f, 0x05070a, 0.55));

/* THE SOFTBOX, AS AN ACTUAL ENVIRONMENT.
   MEASURED, not reasoned: the first frame rendered the skeleton pure black.
   Cause — metalness 0.94 with no environment map has nothing to reflect, so a
   metal surface is black everywhere except the single specular dot. Titanium
   without an env map is not "dark", it is absent. This builds a near-black
   equirect carrying one bright softbox cap in the key direction plus a dim
   ground-bounce band, and PMREMs it. Nothing else in the scene got brighter;
   the metal simply has something to reflect now.                              */
function makeEnv(){
  const W=256,H=128, d=new Float32Array(W*H*4), L=KEYDIR;
  for(let y=0;y<H;y++){
    const v=(y+0.5)/H, dy=Math.sin((v-0.5)*Math.PI), c=Math.sqrt(Math.max(0,1-dy*dy));
    for(let x=0;x<W;x++){
      const ang=((x+0.5)/W-0.5)*Math.PI*2, dx=c*Math.cos(ang), dz=c*Math.sin(ang);
      const dot=dx*L.x+dy*L.y+dz*L.z;
      const box=Math.pow(Math.max(0,dot),46)*30 + Math.pow(Math.max(0,dot),7)*1.5;
      const amb=0.014+0.026*Math.max(0,dy);
      const gb =Math.pow(Math.max(0,-dy),2.0)*0.075;
      const i=(y*W+x)*4;
      d[i  ]=box*1.00+amb*0.55+gb*0.28;
      d[i+1]=box*1.02+amb*0.88+gb*0.55;
      d[i+2]=box*1.05+amb*1.00+gb*0.90;
      d[i+3]=1;
    }
  }
  const tex=new THREE.DataTexture(d,W,H,THREE.RGBAFormat,THREE.FloatType);
  tex.mapping=THREE.EquirectangularReflectionMapping; tex.needsUpdate=true;
  const pm=new THREE.PMREMGenerator(renderer);
  const env=pm.fromEquirectangular(tex).texture;
  pm.dispose(); tex.dispose();
  return env;
}
scene.environment = makeEnv();   // background stays pure black on purpose

/* ══ 3. SHARED GLSL ═══════════════════════════════════════════════════════════ */
const NOISE = `
float h31(vec3 p){ return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453123); }
float vn3(vec3 p){
  vec3 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
  return mix(mix(mix(h31(i),h31(i+vec3(1,0,0)),f.x),mix(h31(i+vec3(0,1,0)),h31(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(h31(i+vec3(0,0,1)),h31(i+vec3(1,0,1)),f.x),mix(h31(i+vec3(0,1,1)),h31(i+vec3(1,1,1)),f.x),f.y),f.z);
}`;

/* ══ 4. THE RIG ═══════════════════════════════════════════════════════════════
   Segments are FLAT-PARENTED rigid bodies. Forward kinematics is solved by hand
   into world position+quaternion per segment, then blended against the WHEELS
   ring solution. Blending world transforms (lerp position, slerp quaternion) is
   why the morph cannot tear: there is no vertex-space interpolation anywhere.   */

/* Proportions are real: palm width ~0.83, wrist-crease to middle tip ~1.83.
   Ratio 2.2 — a human hand. Get this wrong and it reads as a rake, not a hand.  */
const DIGITS = [
  /* THE THUMB IS NOT A SHORT FINGER — qi 2026-08-17: "looks like a broken pinky".
     It gets its own solver (D.dir / D.curl below) because four things have to be
     true at once or the eye reads a damaged digit:
       · TWO phalanges (proximal + distal). The metacarpal is the third segment
         here, but it is a PALM bone, not a joint of the finger.
       · It attaches at the WRIST (carpometacarpal), well BELOW the knuckle row —
         root y -0.47 against the fingers' -0.34.
       · Its metacarpal is rotated ~55 deg OUT OF THE PALM PLANE (+Z component in
         `dir`) so it OPPOSES the fingers instead of lying beside them.
       · It is shorter and thicker than the index, with a broader distal pad.
     `curl` is where the tip travels when it flexes: across the palm, not down. */
  { id:'thumb', root:[-0.300,-0.470, 0.055], cf:1.00,
    dir:[-0.615, 0.500, 0.610], curl:[0.880, 0.230, -0.170],
    segs:[{l:0.455,r0:0.092,r1:0.080},{l:0.300,r0:0.080,r1:0.070,sk:1.05},
          {l:0.215,r0:0.070,r1:0.060,sk:1.16}] },
  { id:'index', root:[-0.340,-0.340, 0.015], yaw:-0.080, pitch:0.0, roll:0, cf:0.94,
    segs:[{l:0.720,r0:0.077,r1:0.067},{l:0.415,r0:0.069,r1:0.061},{l:0.252,r0:0.061,r1:0.053},{l:0.188,r0:0.053,r1:0.039}] },
  { id:'middle',root:[-0.115,-0.345, 0.000], yaw:-0.014, pitch:0.0, roll:0, cf:1.00,
    segs:[{l:0.760,r0:0.079,r1:0.069},{l:0.445,r0:0.071,r1:0.063},{l:0.272,r0:0.063,r1:0.054},{l:0.196,r0:0.054,r1:0.040}] },
  { id:'ring',  root:[ 0.115,-0.340, 0.012], yaw: 0.058, pitch:0.0, roll:0, cf:1.05,
    segs:[{l:0.730,r0:0.075,r1:0.065},{l:0.410,r0:0.067,r1:0.059},{l:0.254,r0:0.059,r1:0.051},{l:0.180,r0:0.051,r1:0.038}] },
  { id:'pinky', root:[ 0.335,-0.325, 0.042], yaw: 0.145, pitch:0.0, roll:0, cf:1.16,
    segs:[{l:0.660,r0:0.069,r1:0.059},{l:0.318,r0:0.061,r1:0.053},{l:0.198,r0:0.053,r1:0.046},{l:0.160,r0:0.046,r1:0.034}] },
];

// pose presets — flexion in radians at [MCP, PIP, DIP]; splay = abduction
const POSE = {
  idle  : { mcp:0.30, pip:0.55, dip:0.34, splay:0.055, thumb:[0.10,0.30,0.26], wristPitch:-0.10 },
  hand  : { mcp:0.04, pip:0.09, dip:0.05, splay:0.175, thumb:[0.02,0.06,0.05], wristPitch: 0.06 },
  orb   : { mcp:1.52, pip:1.78, dip:1.12, splay:-0.030, thumb:[0.55,0.95,0.85], wristPitch:-0.22 },
  wheels: { mcp:0.55, pip:0.62, dip:0.38, splay:0.090, thumb:[0.20,0.35,0.30], wristPitch: 0.00 },
  grasp : { mcp:0.98, pip:1.38, dip:0.86, splay:0.010, thumb:[0.42,0.75,0.68], wristPitch:-0.06 },
};

const rig = new THREE.Group(); scene.add(rig);

// segment records: {digit, idx, len, r0, r1, boneMesh, skinMesh, wpos, wquat, ...}
const SEG = [];
const _v1=new THREE.Vector3(), _v2=new THREE.Vector3(), _q1=new THREE.Quaternion(),
      _q2=new THREE.Quaternion(), _q=new THREE.Quaternion(), _baseQ=new THREE.Quaternion(),
      _e1=new THREE.Euler(), _joint=new THREE.Vector3(),
      _UP=new THREE.Vector3(0,1,0), _AX=new THREE.Vector3(1,0,0), _AZ=new THREE.Vector3(0,0,1);

/* ── bone geometry: tapered shaft + condyle spheres at both ends ────────────── */
function boneMesh(l, r0, r1, mat, matDark){
  const g = new THREE.Group();
  const shaft = new THREE.CylinderGeometry(r1*0.80, r0*0.80, l, 16, 1, true);
  const sm = new THREE.Mesh(shaft, mat); sm.castShadow=true; sm.receiveShadow=true; g.add(sm);
  // condyles — the knuckle balls that make it read as an articulating skeleton
  const cg = new THREE.SphereGeometry(1, 14, 10);
  const c0 = new THREE.Mesh(cg, matDark); c0.scale.setScalar(r0*0.94); c0.position.y=-l/2;
  const c1 = new THREE.Mesh(cg, matDark); c1.scale.setScalar(r1*0.94); c1.position.y= l/2;
  c0.castShadow=c1.castShadow=true; g.add(c0); g.add(c1);
  // tendon / fiber bundle running the length of the shaft, dorsal side
  const tg = new THREE.CylinderGeometry(r1*0.19, r1*0.19, l*0.96, 6, 1, true);
  const t1 = new THREE.Mesh(tg, matDark); t1.position.set( r0*0.55,0,-r0*0.30);
  const t2 = new THREE.Mesh(tg, matDark); t2.position.set(-r0*0.55,0,-r0*0.30);
  g.add(t1); g.add(t2);
  return g;
}

/* ── epidermis: capsule sleeve carrying baked AO + translucency attributes ──── */
function skinGeom(l, r0, r1){
  const rr = (r0+r1)*0.5 * 1.34;                  // flesh sits proud of the bone
  const g  = new THREE.CapsuleGeometry(rr, l*0.94, 6, 18);
  const p  = g.attributes.position, n = p.count;
  const trans = new Float32Array(n), ao = new Float32Array(n);
  const half = l*0.47 + rr;
  for(let i=0;i<n;i++){
    const y = p.getY(i);
    // thin where the segment necks down at the joint contours -> light bleeds there
    const edge = Math.min(1, Math.abs(y)/half);
    trans[i] = Math.min(1, 0.34 + 0.62*Math.pow(edge,1.7) + (0.075-rr*0.5)*3.2);
    ao[i] = 1;
  }
  g.setAttribute('aTrans', new THREE.BufferAttribute(trans,1));
  g.setAttribute('aAO',    new THREE.BufferAttribute(ao,1));
  return g;
}

const boneMat = new THREE.MeshPhysicalMaterial({          // brushed titanium
  color:0xa8b0b6, metalness:0.88, roughness:0.30,
  clearcoat:0.40, clearcoatRoughness:0.34, envMapIntensity:1.35 });
// carbon-graphite is a DIELECTRIC — high metalness here is what made it vanish
const boneDark = new THREE.MeshPhysicalMaterial({         // matte carbon-graphite
  color:0x2a2f34, metalness:0.18, roughness:0.66, envMapIntensity:0.9 });

const SKIN_UNIFORMS_PROTO = () => ({
  uT:{value:0}, uL:{value:KEYDIR.clone()}, uLcol:{value:new THREE.Color(0.95,1.0,0.97)},
  uFill:{value:new THREE.Color(0.24,0.46,0.62)},
  uSSS:{value:new THREE.Color(0.92,0.20,0.09)},   // subdermal blood / energy bleed
  uSSSInt:{value:0.85}, uPulse:{value:0.0},
  uPulseCol:{value:new THREE.Color(0.32,1.0,0.74)},
  uOpacity:{value:1.0}, uWeb:{value:0.0}, uBase:{value:0.085}
});

const SKIN_VS = `
attribute float aTrans; attribute float aAO;
varying vec3 vN; varying vec3 vWP; varying float vTr; varying float vAO;
void main(){
  vN  = normalize(mat3(modelMatrix)*normal);
  vec4 wp = modelMatrix*vec4(position,1.0);
  vWP = wp.xyz; vTr = aTrans; vAO = aAO;
  gl_Position = projectionMatrix*viewMatrix*wp;
}`;

const SKIN_FS = `
precision highp float;
uniform float uT, uSSSInt, uPulse, uOpacity, uWeb, uBase;
uniform vec3 uL, uLcol, uFill, uSSS, uPulseCol;
varying vec3 vN; varying vec3 vWP; varying float vTr; varying float vAO;
${NOISE}
void main(){
  vec3 N = normalize(vN);
  if(!gl_FrontFacing) N = -N;
  vec3 V = normalize(cameraPosition - vWP);

  // procedural micro-roughness: pore-scale + oil-film scale
  float mr = vn3(vWP*52.0)*0.62 + vn3(vWP*146.0)*0.38;
  float rough = clamp(0.13 + mr*0.34, 0.05, 0.62);

  float ndl  = max(dot(N,uL),0.0);
  float fres = pow(1.0 - max(dot(N,V),0.0), 3.1);

  // ── subsurface scattering: back-lobe transmission + wrapped diffuse ──
  vec3  Hs   = normalize(uL + N*0.45);
  float back = pow(clamp(dot(V,-Hs),0.0,1.0), 4.6) * 2.15;
  float wrap = clamp((dot(N,uL)+0.58)/1.58, 0.0, 1.0);
  float thin = mix(vTr, 1.0, uWeb);
  vec3  sss  = uSSS * (back + wrap*0.44) * thin * uSSSInt;

  // ── grazing-angle specular, roughness shifts the lobe ──
  vec3  Hv   = normalize(uL+V);
  float spec = pow(max(dot(N,Hv),0.0), mix(190.0, 20.0, rough));
  float f0   = 0.030 + 0.34*fres;
  vec3  specC= uLcol * spec * f0 * 6.2;

  // ── ground-bounce fill on downward faces ──
  vec3 fill = uFill * max(-N.y,0.0) * 0.40;

  // ── sub-dermal conduit bleeding out through the flesh ──
  vec3 glow = uPulseCol * uPulse * (0.30 + 0.70*(1.0-fres)) * thin;

  vec3 col = (sss + glow + fill)*vAO + specC + uLcol*ndl*0.10*vAO;
  float a  = clamp(uBase + fres*0.70 + spec*0.60 + uPulse*0.12, 0.0, 0.95)*uOpacity;
  a *= mix(1.0, 0.62, uWeb);
  gl_FragColor = vec4(col, a);
}`;

function skinMaterial(web){
  const u = SKIN_UNIFORMS_PROTO(); u.uWeb.value = web?1:0;
  return new THREE.ShaderMaterial({
    uniforms:u, vertexShader:SKIN_VS, fragmentShader:SKIN_FS,
    transparent:true, depthWrite:false, side:web?THREE.DoubleSide:THREE.FrontSide });
}

/* ── build every segment ────────────────────────────────────────────────────── */
DIGITS.forEach((d,di)=>{
  d.segs.forEach((s,si)=>{
    const bone = boneMesh(s.l, s.r0, s.r1, boneMat, boneDark);
    rig.add(bone);
    const sk = new THREE.Mesh(skinGeom(s.l,s.r0,s.r1), skinMaterial(false));
    sk.renderOrder = 4; rig.add(sk);
    SEG.push({ d:di, s:si, id:d.id, l:s.l, r0:s.r0, r1:s.r1, bone, skin:sk,
               fkP:new THREE.Vector3(), fkQ:new THREE.Quaternion(),
               wP:new THREE.Vector3(),  wQ:new THREE.Quaternion(),
               j0:new THREE.Vector3(),  j1:new THREE.Vector3(), pulse:0 });
  });
});

/* ── carpus (wrist block) + palm shell + forearm cuff ───────────────────────── */
const carpus = new THREE.Group(); rig.add(carpus);
{
  const cg = new THREE.SphereGeometry(1,20,14);
  const c  = new THREE.Mesh(cg, boneDark); c.scale.set(0.315,0.155,0.118);
  c.position.set(-0.01,-0.435,0.014); c.castShadow=true; carpus.add(c);
  // mechanical cuff — a machined band at the wrist, sells the synthetic build
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.285,0.028,10,40), boneMat);
  ring.rotation.x = Math.PI/2; ring.position.set(-0.01,-0.575,0.018);
  ring.castShadow=true; carpus.add(ring);
  const ring2 = new THREE.Mesh(new THREE.TorusGeometry(0.240,0.016,8,36), boneDark);
  ring2.rotation.x = Math.PI/2; ring2.position.set(-0.01,-0.665,0.018); carpus.add(ring2);
  const stub = new THREE.Mesh(new THREE.CylinderGeometry(0.192,0.225,0.32,20,1,true), boneDark);
  stub.position.set(-0.01,-0.775,0.018); stub.castShadow=true; carpus.add(stub);
}

const palmSkin = (()=>{
  const g = new THREE.SphereGeometry(1, 30, 22);
  const p = g.attributes.position;
  for(let i=0;i<p.count;i++){                       // sculpt sphere -> palm pad
    let x=p.getX(i), y=p.getY(i), z=p.getZ(i);
    x*=0.400; y*=0.470; z*=0.140;
    x *= 1 - 0.16*Math.max(0,-y/0.47);              // narrows toward the wrist
    z += 0.034*Math.cos(x*3.9);                     // palmar hollow
    y += 0.010;
    p.setXYZ(i,x,y,z);
  }
  g.computeVertexNormals();
  const n=p.count, tr=new Float32Array(n), ao=new Float32Array(n);
  for(let i=0;i<n;i++){ const y=p.getY(i);
    tr[i]=Math.min(1,0.24+0.58*Math.pow(Math.min(1,Math.abs(y)/0.44),2.0)); ao[i]=1; }
  g.setAttribute('aTrans',new THREE.BufferAttribute(tr,1));
  g.setAttribute('aAO',   new THREE.BufferAttribute(ao,1));
  const m = new THREE.Mesh(g, skinMaterial(false)); m.renderOrder=4; rig.add(m);
  // the palm is the MASS of the hand — at the segment alpha floor it read as a

/* ══ 5. SUB-DERMAL NEURAL CONDUITS ════════════════════════════════════════════
   Dense point chains threaded just under the palmar skin, one per digit plus two
   palm trunks. A signal travels the arc-length; brightness is state-driven, and
   the value is fed back into each segment's skin shader so the flesh lights from
   inside rather than a decal glow sitting on top.                                */
const CON_PER = LOW ? 22 : 34;

DIGITS.forEach((d,di)=>{
  const segIdx = SEG.map((s,k)=>s.d===di?k:-1).filter(k=>k>=0);
  conduits.push({ segIdx, n:CON_PER, off:new THREE.Vector3(0,0,1) });
});
const CON_N = conduits.length*CON_PER;
const conPos = new Float32Array(CON_N*3);
const conT   = new Float32Array(CON_N);        // 0..1 along the path
const conBr  = new Float32Array(CON_N);        // per-point brightness
const conSz  = new Float32Array(CON_N);
{ let k=0; conduits.forEach(c=>{ for(let i=0;i<c.n;i++,k++){
    conT[k]=i/(c.n-1); conSz[k]=1.0; } }); }

conGeo.setAttribute('position',new THREE.BufferAttribute(conPos,3));
conGeo.setAttribute('aT',      new THREE.BufferAttribute(conT,1));
conGeo.setAttribute('aBr',     new THREE.BufferAttribute(conBr,1));

const conMat = new THREE.ShaderMaterial({
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  uniforms:{ uT:{value:0}, uPx:{value:1}, uCol:{value:new THREE.Color(0.30,1.0,0.72)},
             uAmp:{value:1.0} },
  vertexShader:`
    attribute float aT; attribute float aBr; attribute float aSz;
    uniform float uT; uniform float uPx; uniform float uAmp;
    varying float vB;
    void main(){
      vec4 mv = modelViewMatrix*vec4(position,1.0);

    }`,
  fragmentShader:`
    precision highp float; uniform vec3 uCol; varying float vB;

      float f = exp(-r*13.0);

});
const conPts = new THREE.Points(conGeo, conMat);
conPts.renderOrder = 3; conPts.frustumCulled = false; rig.add(conPts);

/* ══ 8. GROUND — real shadow map + analytic distance-based penumbra ═══════════ */
const OCC_N = 7;
const occPos = []; for(let i=0;i<OCC_N;i++) occPos.push(new THREE.Vector4(0,9,0,0.001));
const groundMat = new THREE.MeshStandardMaterial({
  color:0x05070a, roughness:0.90, metalness:0.10 });
const GROUND_OCC = `
  // analytic contact shadow: the penumbra widens with the occluder's height,
  // and the core darkens as the entity approaches the floor. This is the
  // "distance-based penumbra falloff" the spec asks for; the shadow map on top
  // of it supplies the crisp near-contact detail.
  float occ = 0.0;
  for(int i=0;i<${OCC_N};i++){
    vec4 o = uOcc[i];
    float h = max(o.y - vGP.y, 0.001);
    float pen = o.w + h*0.62;
    float d = length(vGP.xz - o.xz);
    float s = 1.0 - smoothstep(pen*0.26, pen, d);
    occ = max(occ, s / (1.0 + h*1.55));
  }
  gl_FragColor.rgb *= (1.0 - clamp(occ,0.0,1.0)*0.92);
`;
groundMat.onBeforeCompile = (sh)=>{
  sh.uniforms.uOcc = { value: occPos };
  sh.vertexShader = sh.vertexShader
    .replace('#include <common>', '#include <common>\nvarying vec3 vGP;')
    .replace('#include <begin_vertex>', '#include <begin_vertex>\nvGP = (modelMatrix*vec4(transformed,1.0)).xyz;');
  sh.fragmentShader = sh.fragmentShader
    .replace('#include <common>', '#include <common>\nvarying vec3 vGP;\nuniform vec4 uOcc['+OCC_N+'];')
    .replace('#include <dithering_fragment>', GROUND_OCC + '\n#include <dithering_fragment>');
  groundMat.userData.sh = sh;
};
const ground = new THREE.Mesh(new THREE.PlaneGeometry(26,26,1,1), groundMat);
ground.rotation.x = -Math.PI/2; ground.position.y = -1.62; ground.receiveShadow = true;
scene.add(ground);

/* ══ 9. VOLUMETRIC DUST — strictly inside the light cone, and occluded ════════
   qi rejected untextured haze on the graph page. This is not that. Every mote is
   cone-gated (outside the key light's cone it contributes literally nothing), is
   shadowed by the same occluder spheres that darken the floor, and is weighted by
   a forward-scattering Mie phase term so the volume brightens only when you look
   into the light. Turn the light off and the volume disappears.                  */
const DUST_N = LOW ? 900 : 2600;
const dustP = new Float32Array(DUST_N*3), dustPh = new Float32Array(DUST_N),
      dustS = new Float32Array(DUST_N),   dustK  = new Float32Array(DUST_N);
for(let i=0;i<DUST_N;i++){
  const ground_layer = Math.random()<0.34;
  const r = Math.pow(Math.random(),0.55)*2.35;
  const a = Math.random()*6.283;
  dustP[i*3  ] = Math.cos(a)*r;
  dustP[i*3+1] = ground_layer ? (-1.60 + Math.random()*0.42) : (-1.6 + Math.random()*3.5);
  dustP[i*3+2] = Math.sin(a)*r;
  dustPh[i] = Math.random()*6.283;
  dustS[i]  = ground_layer ? (1.6+Math.random()*3.4) : (0.35+Math.random()*1.25);
  dustK[i]  = ground_layer ? 0.0 : 1.0;
}
const dustGeo = new THREE.BufferGeometry();
dustGeo.setAttribute('position',new THREE.BufferAttribute(dustP,3));
dustGeo.setAttribute('aPh',new THREE.BufferAttribute(dustPh,1));
dustGeo.setAttribute('aSz',new THREE.BufferAttribute(dustS,1));
dustGeo.setAttribute('aK', new THREE.BufferAttribute(dustK,1));
const dustMat = new THREE.ShaderMaterial({
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  uniforms:{
    uT:{value:0}, uPx:{value:1},
    uLpos:{value:KEYDIR.clone().multiplyScalar(7)},
    uLdir:{value:KEYDIR.clone().negate()},
    uCos:{value:Math.cos(0.46)},
    uOcc:{value:occPos},
    uCol:{value:new THREE.Color(0.86,0.96,1.0)}
  },
  vertexShader:`
    attribute float aPh; attribute float aSz; attribute float aK;
    uniform float uT, uPx, uCos; uniform vec3 uLpos, uLdir; uniform vec4 uOcc[${OCC_N}];
    varying float vA;
    void main(){
      // Brownian wander — layered incommensurate drift, never a loop
      vec3 p = position;
      p.x += sin(uT*0.31+aPh)*0.16 + sin(uT*0.87+aPh*2.7)*0.045;
      p.y += cos(uT*0.24+aPh*1.7)*0.11*aK + uT*0.014*aK;
      p.z += cos(uT*0.37+aPh*0.6)*0.16 + cos(uT*0.79+aPh*3.1)*0.045;
      p.y = mod(p.y+1.85, 5.2) - 1.85;

      // CONE GATE — outside the key light's cone this mote is pure black
      vec3 toP  = p - uLpos;
      float ax  = dot(toP, uLdir);
      vec3  perp= toP - uLdir*ax;
      float cosA= ax / max(length(toP),0.0001);
      float cone= smoothstep(uCos, uCos+0.085, cosA);

      // OCCLUSION — shafts: is the path back to the light blocked by the entity?
      float sh = 0.0;
      for(int i=0;i<${OCC_N};i++){
        vec4 o = uOcc[i];
        vec3 L = normalize(uLpos - p);
        vec3 d = o.xyz - p;
        float t = dot(d, L);
        if(t > 0.0){
          float r = length(d - L*t);
          sh = max(sh, 1.0 - smoothstep(o.w*0.55, o.w*1.9, r));
        }
      }

      // MIE forward scattering — the volume only lights up facing the source
      vec4 mv = modelViewMatrix*vec4(p,1.0);
      vec3 V  = normalize(cameraPosition - p);
      float phase = 0.28 + 0.90*pow(max(dot(V,-uLdir),0.0), 3.4);

      float falloff = 1.0/(1.0+ax*ax*0.024);
      vA = cone*(1.0-sh*0.92)*phase*falloff*(aK>0.5?0.055:0.030);
      gl_PointSize = aSz*uPx*(2.4/max(-mv.z,0.001));
      gl_Position  = projectionMatrix*mv;
    }`,
  fragmentShader:`precision highp float; uniform vec3 uCol; varying float vA;
    void main(){ vec2 d=gl_PointCoord-0.5; float r=dot(d,d); if(r>0.25) discard;
      float f=exp(-r*9.0); gl_FragColor=vec4(uCol*vA*f*2.6, vA*f); }`
});
const dust = new THREE.Points(dustGeo, dustMat);
dust.frustumCulled=false; dust.renderOrder=2; scene.add(dust);

/* ══ 10. POST CHAIN (hand-rolled: HDR -> bloom -> DoF+CA+grain -> ACES) ═══════ */
const fsScene = new THREE.Scene();
const fsCam   = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const fsQuad  = new THREE.Mesh(new THREE.PlaneGeometry(2,2), null);
fsQuad.frustumCulled=false; fsScene.add(fsQuad);
function blit(mat, target){
  fsQuad.material = mat;
  renderer.setRenderTarget(target||null);
  renderer.render(fsScene, fsCam);
}
const RTopt = { minFilter:THREE.LinearFilter, magFilter:THREE.LinearFilter,
                type:THREE.HalfFloatType, format:THREE.RGBAFormat,
                depthBuffer:false, generateMipmaps:false };
let rtScene, rtA0, rtA1, rtB0, rtB1, depthTex;

function makeTargets(w,h){
  [rtScene,rtA0,rtA1,rtB0,rtB1].forEach(t=>t&&t.dispose());
  if(depthTex) depthTex.dispose();
  depthTex = new THREE.DepthTexture(w,h);
  depthTex.type = IS_WEBGL2 ? THREE.UnsignedIntType : THREE.UnsignedShortType;
  depthTex.minFilter = depthTex.magFilter = THREE.NearestFilter;
  rtScene = new THREE.WebGLRenderTarget(w,h,{...RTopt, depthBuffer:true, depthTexture:depthTex});
  const hw=Math.max(2,w>>1), hh=Math.max(2,h>>1), qw=Math.max(2,w>>2), qh=Math.max(2,h>>2);
  rtA0=new THREE.WebGLRenderTarget(hw,hh,RTopt); rtA1=new THREE.WebGLRenderTarget(hw,hh,RTopt);
  rtB0=new THREE.WebGLRenderTarget(qw,qh,RTopt); rtB1=new THREE.WebGLRenderTarget(qw,qh,RTopt);
}

const brightMat = new THREE.ShaderMaterial({
  uniforms:{ tD:{value:null}, uThr:{value:0.62}, uKnee:{value:0.42} },
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.0,1.0); }`,
  fragmentShader:`precision highp float; uniform sampler2D tD; uniform float uThr,uKnee;
    varying vec2 vUv;
    void main(){ vec3 c=texture2D(tD,vUv).rgb;
      float l=max(c.r,max(c.g,c.b));
      float s=clamp((l-uThr)/max(uKnee,1e-4),0.0,1.0); s=s*s;
      gl_FragColor=vec4(c*s, 1.0); }`
});
const blurMat = new THREE.ShaderMaterial({
  uniforms:{ tD:{value:null}, uDir:{value:new THREE.Vector2(1,0)}, uTex:{value:new THREE.Vector2(1,1)} },
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.0,1.0); }`,
  fragmentShader:`precision highp float; uniform sampler2D tD; uniform vec2 uDir,uTex;
    varying vec2 vUv;
    void main(){
      vec2 o = uDir/uTex;
      vec3 c = texture2D(tD,vUv).rgb*0.2270270270;
      c += (texture2D(tD,vUv+o*1.3846153846).rgb + texture2D(tD,vUv-o*1.3846153846).rgb)*0.3162162162;
      c += (texture2D(tD,vUv+o*3.2307692308).rgb + texture2D(tD,vUv-o*3.2307692308).rgb)*0.0702702703;
      gl_FragColor=vec4(c,1.0); }`
});
const downMat = new THREE.ShaderMaterial({
  uniforms:{ tD:{value:null}, uTex:{value:new THREE.Vector2(1,1)} },
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.0,1.0); }`,
  fragmentShader:`precision highp float; uniform sampler2D tD; uniform vec2 uTex; varying vec2 vUv;
    void main(){ vec2 o=1.0/uTex;
      vec3 c = texture2D(tD,vUv+vec2(-o.x,-o.y)).rgb + texture2D(tD,vUv+vec2(o.x,-o.y)).rgb
             + texture2D(tD,vUv+vec2(-o.x, o.y)).rgb + texture2D(tD,vUv+vec2(o.x, o.y)).rgb;
      gl_FragColor=vec4(c*0.25,1.0); }`
});

const compMat = new THREE.ShaderMaterial({
  uniforms:{
    tScene:{value:null}, tBloomA:{value:null}, tBloomB:{value:null}, tDepth:{value:null},
    uRes:{value:new THREE.Vector2(1,1)}, uT:{value:0},
    uNear:{value:camera.near}, uFar:{value:camera.far},
    uFocus:{value:4.0}, uAperture:{value:1.0},
    uExposure:{value:1.1},        // spec value, applied exactly once, here
    uBloom:{value:0.62}, uCA:{value:1.0}, uGrain:{value:1.0}, uVig:{value:1.0}
  },
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.0,1.0); }`,
  fragmentShader:`
precision highp float;
uniform sampler2D tScene,tBloomA,tBloomB,tDepth;
uniform vec2 uRes; uniform float uT,uNear,uFar,uFocus,uAperture,uExposure,uBloom,uCA,uGrain,uVig;
varying vec2 vUv;

float linDepth(vec2 uv){
  float d = texture2D(tDepth,uv).x;
  float vz = (uNear*uFar)/((uFar-uNear)*d - uFar);
  return -vz;
}
vec3 ACES(vec3 x){
  const float a=2.51,b=0.03,c=2.43,d=0.59,e=0.14;
  return clamp((x*(a*x+b))/(x*(c*x+d)+e),0.0,1.0);
}
float hash12(vec2 p){ vec3 p3=fract(vec3(p.xyx)*0.1031); p3+=dot(p3,p3.yzx+33.33);
  return fract((p3.x+p3.y)*p3.z); }

void main(){
  vec2 uv = vUv;
  vec2 ctr = uv-0.5;
  float r2 = dot(ctr,ctr);

  // ── depth of field: circle of confusion against the active-digit focus ──
  float dep = linDepth(uv);
  float coc = clamp(abs(dep-uFocus)/max(dep,0.001)*uAperture, 0.0, 1.0);
  coc = pow(coc,0.85)*0.026;

  // ── chromatic aberration: radial channel split, grows with r^2 ──
  vec2 ca = ctr*r2*0.0125*uCA;

  // 12-tap poisson gather, unrolled (GLSL ES 1.00 — no array initialisers)
  #define TAP(OX,OY) { vec2 o=vec2(OX,OY)*coc; float dd=linDepth(uv+o); \
      float w=(dd > uFocus-0.35) ? 1.0 : 0.55; \
      acc += texture2D(tScene, uv+o).rgb * w; wsum += w; }

  vec3 col;
  if(coc > 0.0016){
    vec3 acc = vec3(0.0); float wsum = 0.0;
    TAP(-0.326,-0.406) TAP(-0.840,-0.074) TAP(-0.696, 0.457) TAP(-0.203, 0.621)
    TAP( 0.962,-0.195) TAP( 0.473,-0.480) TAP( 0.519, 0.767) TAP( 0.185,-0.893)
    TAP( 0.507, 0.064) TAP( 0.896, 0.412) TAP(-0.322,-0.933) TAP(-0.792,-0.598)
    col = acc/max(wsum,1e-4);
  } else {
    col = texture2D(tScene, uv).rgb;
  }
  // apply CA on top of the (possibly blurred) result using sharp channel taps
  float caAmt = clamp(r2*3.4,0.0,1.0)*uCA;
  if(caAmt > 0.004){
    vec3 sh = vec3(
      texture2D(tScene, uv+ca).r,
      texture2D(tScene, uv     ).g,
      texture2D(tScene, uv-ca).b);
    col = mix(col, mix(col, sh, 0.85), caAmt);
  }

  // ── bloom ──
  vec3 bl = texture2D(tBloomA,uv).rgb*0.62 + texture2D(tBloomB,uv).rgb*0.88;
  col += bl*uBloom;

  // ── exposure + ACES filmic ──
  col = ACES(col*uExposure);

  // ── sensor grain: strongest in the shadows, kills the CG sheen ──
  // MEASURED: at 0.030/0.055 the grain WAS the image — a near-black frame is
  // almost all shadow, so the shadow-boost applied everywhere. Keep it a texture,
  // never a texture you notice.
  float lum = dot(col, vec3(0.299,0.587,0.114));
  float g = hash12(uv*uRes + fract(uT)*911.7) - 0.5;
  col += g * (0.008 + 0.017*(1.0-smoothstep(0.0,0.55,lum))) * uGrain;

  // ── vignette ──
  col *= mix(1.0, 1.0 - r2*0.55, uVig);

  // linear -> sRGB
  col = max(col, 0.0);
  vec3 lo = col*12.92;
  vec3 hi = 1.055*pow(col, vec3(1.0/2.4)) - 0.055;
  gl_FragColor = vec4(mix(hi, lo, step(col, vec3(0.0031308))), 1.0);
}`
});

/* ══ 11. INTERACTION — mass, inertia, damping. Never 1:1. ═════════════════════ */
const IN = {
  px:0, py:0,                 // pointer in NDC
  tx:0, ty:0,                 // damped target the entity actually believes
  vx:0, vy:0,                 // target velocity (the mass)
  prox:0, proxT:0,            // 0..1 proximity
  down:false, grasp:0, graspT:0,
  orbYaw:0.10, orbPitch:0.08, orbVYaw:0, orbVPitch:0, dragging:false,
  lastX:0, lastY:0, dist: LOW?4.3:3.35, distT: LOW?4.3:3.35,
  idleAt: performance.now()
};
const curEl = document.getElementById('cur');
const chrome = document.getElementById('chrome');
let chromeT = 0;
function wake(){ chromeT = performance.now(); if(UI) chrome.classList.add('on'); }

function pointerNDC(e){
  IN.px = (e.clientX/innerWidth)*2-1;
  IN.py = -((e.clientY/innerHeight)*2-1);
  IN.idleAt = performance.now();
}
addEventListener('pointermove', e=>{
  pointerNDC(e);
  if(IN.dragging){
    IN.orbVYaw   += (e.clientX-IN.lastX)*0.00062;
    IN.orbVPitch += (e.clientY-IN.lastY)*0.00046;
  }
  IN.lastX=e.clientX; IN.lastY=e.clientY;
  curEl.style.left=e.clientX+'px'; curEl.style.top=e.clientY+'px';
  if(e.clientY > innerHeight-120) wake();
},{passive:true});
addEventListener('pointerdown', e=>{
  IN.down=true; IN.dragging=true; IN.lastX=e.clientX; IN.lastY=e.clientY; pointerNDC(e); wake();
},{passive:true});
addEventListener('pointerup',   ()=>{ IN.down=false; IN.dragging=false; },{passive:true});
addEventListener('pointercancel',()=>{ IN.down=false; IN.dragging=false; },{passive:true});
addEventListener('wheel', e=>{ IN.distT = Math.min(9.5, Math.max(2.2, IN.distT + e.deltaY*0.0026)); },{passive:true});
addEventListener('keydown', e=>{
  const k={'1':'idle','2':'hand','3':'orb','4':'wheels'}[e.key];

});

/* ══ 12. MORPHOLOGICAL STATE ══════════════════════════════════════════════════ */
const W = { idle:1, hand:0, orb:0, wheels:0 };
let STATE = 'idle';
function setState(s){
  if(!(s in W)) return;
  STATE = s; wake();
  for(const b of chrome.querySelectorAll('[data-s]')) b.classList.toggle('a', b.dataset.s===s);
  tick(0.0001, true);           // land one frame of the new weights immediately
  audioCue(s);
}
if(UI) for(const b of chrome.querySelectorAll('[data-s]')) b.onclick=()=>setState(b.dataset.s);

/* ══ 13. WHEELS RING TARGETS ══════════════════════════════════════════════════ */
const RINGS = [
  { q:new THREE.Quaternion().setFromEuler(new THREE.Euler(0,0,0)),          r:0.92, sp: 0.55 },
  { q:new THREE.Quaternion().setFromEuler(new THREE.Euler(Math.PI/2,0,0)),  r:1.06, sp:-0.41 },
  { q:new THREE.Quaternion().setFromEuler(new THREE.Euler(0,Math.PI/2,.35)),r:0.79, sp: 0.72 },
];
const _ringP = new THREE.Vector3(), _ringT = new THREE.Vector3(), _ringQ = new THREE.Quaternion();

/* ══ 14. FORWARD KINEMATICS ═══════════════════════════════════════════════════ */
function lerpPose(w){
  const P = {mcp:0,pip:0,dip:0,splay:0,thumb:[0,0,0],wristPitch:0};
  let tot=0;
  for(const k of ['idle','hand','orb','wheels']){
    const a=w[k]; if(a<=0.0001) continue; tot+=a;
    const s=POSE[k];
    P.mcp+=s.mcp*a; P.pip+=s.pip*a; P.dip+=s.dip*a; P.splay+=s.splay*a;
    P.wristPitch+=s.wristPitch*a;
    for(let i=0;i<3;i++) P.thumb[i]+=s.thumb[i]*a;
  }
  if(tot>0.0001){ P.mcp/=tot;P.pip/=tot;P.dip/=tot;P.splay/=tot;P.wristPitch/=tot;
    for(let i=0;i<3;i++) P.thumb[i]/=tot; }
  return P;
}

const wristQ = new THREE.Quaternion();
const TIP = new THREE.Vector3();     // active digit tip, world — the DoF focus

function solveFK(P, t, tremor, graspW, reachW){
  // wrist: tracks the damped pointer with mass, plus slow postural drift
  const yaw   = IN.tx*0.60 + Math.sin(t*0.17)*0.045;
  const pitch = -IN.ty*0.46 + P.wristPitch + Math.sin(t*0.13+1.1)*0.035;
  const roll  = Math.sin(t*0.11+2.2)*0.05 + IN.tx*0.14;
  _e1.set(pitch, yaw, roll, 'YXZ');
  wristQ.setFromEuler(_e1);
  rig.quaternion.copy(wristQ);

  let si = 0;
  for(let di=0; di<DIGITS.length; di++){
    const D = DIGITS[di];
    const isThumb = D.id==='thumb';
    // digit base orientation
    _e1.set(D.pitch, D.yaw + (isThumb?0:P.splay*(di-2.5)*0.42), D.roll, 'YXZ');
    _baseQ.setFromEuler(_e1);
    _joint.set(D.root[0],D.root[1],D.root[2]);
    const joint = _joint;
    _q.copy(_baseQ);
    const q = _q;

    for(let k=0;k<D.segs.length;k++,si++){
      const S = D.segs[k];
      const seg = SEG[si];
      let flex;
      if(isThumb){ flex = P.thumb[k]*D.cf; }
      else if(k===0){ flex = 0.03 + P.mcp*0.05; }        // metacarpal barely moves
      else if(k===1){ flex = P.mcp*D.cf; }
      else if(k===2){ flex = P.pip*D.cf; }
      else           { flex = P.dip*D.cf; }

      // organic tremor — per-joint, incommensurate, never repeats
      flex += tremor*(Math.sin(t*(5.7+di*0.83+k*1.31)+di*2.1+k*0.7)*0.0125
                    + Math.sin(t*(13.1+k*2.7)+di)*0.0055);
      // proximity: the digits extend slightly toward what is near
      flex -= reachW*0.20*(k>=1?1:0.25);
      flex += graspW*0.30*(k>=1?1:0.15);

      _q1.setFromAxisAngle(_AX, flex);
      if(k===1 && !isThumb){
        _q2.setFromAxisAngle(_AZ, -P.splay*(di-2.5)*0.30);
        _q1.multiply(_q2);
      }
      q.multiply(_q1);

      // segment centre = joint + dir * len/2
      const dir = _v2.set(0,1,0).applyQuaternion(q);
      seg.j0.copy(joint);
      seg.fkP.copy(joint).addScaledVector(dir, S.l*0.5);
      seg.fkQ.copy(q);
      joint.addScaledVector(dir, S.l);
      seg.j1.copy(joint);
    }
  }
}

/* ── bake AO into the epidermis from the resting pose ──────────────────────── */
function bakeAO(){
  const A=new THREE.Vector3(),B=new THREE.Vector3(),Pp=new THREE.Vector3(),AB=new THREE.Vector3(),AP=new THREE.Vector3();
  const all = SEG.map(s=>({p0:s.j0.clone(), p1:s.j1.clone(), r:(s.r0+s.r1)*0.5*1.34}));
  for(const s of SEG){
    const g=s.skin.geometry, pos=g.attributes.position, ao=g.attributes.aAO;
    for(let i=0;i<pos.count;i++){
      Pp.set(pos.getX(i),pos.getY(i),pos.getZ(i)).applyQuaternion(s.fkQ).add(s.fkP);
      let occ=0;
      for(let j=0;j<all.length;j++){
        const o=all[j];
        if(o.p0.distanceToSquared(s.j0)<1e-9 && o.p1.distanceToSquared(s.j1)<1e-9) continue;
        A.copy(o.p0); B.copy(o.p1); AB.subVectors(B,A); AP.subVectors(Pp,A);
        let tt = AP.dot(AB)/Math.max(AB.lengthSq(),1e-9); tt=Math.max(0,Math.min(1,tt));
        const d = Pp.distanceTo(A.addScaledVector(AB,tt));
        occ += Math.max(0, 1 - d/(o.r*2.55));
      }
      ao.setX(i, Math.max(0.22, 1 - occ*0.60));
    }
    ao.needsUpdate=true;
  }
  // palm shell AO
  { const g=palmSkin.geometry, pos=g.attributes.position, ao=g.attributes.aAO;
    for(let i=0;i<pos.count;i++){
      Pp.set(pos.getX(i),pos.getY(i),pos.getZ(i));
      let occ=0;
      for(const o of all){
        A.copy(o.p0); B.copy(o.p1); AB.subVectors(B,A); AP.subVectors(Pp,A);
        let tt=AP.dot(AB)/Math.max(AB.lengthSq(),1e-9); tt=Math.max(0,Math.min(1,tt));
        const d=Pp.distanceTo(A.addScaledVector(AB,tt));
        occ += Math.max(0, 1 - d/(o.r*2.0));
      }
      ao.setX(i, Math.max(0.25, 1-occ*0.42));
    }
    ao.needsUpdate=true;
  }
}

/* ══ 15. AUDIO — muted until a gesture, per canon. Never autoplays. ═══════════ */
let AC=null, master=null, hum=null, audioOn=false;
const audBtn = document.getElementById('aud');
function audioInit(){
  if(AC) return;
  AC = new (window.AudioContext||window.webkitAudioContext)();
  master = AC.createGain(); master.gain.value = 0; master.connect(AC.destination);
  const pan = AC.createPanner(); pan.panningModel='HRTF'; pan.setPosition(0,0,-1); pan.connect(master);
  const o1=AC.createOscillator(); o1.type='sine'; o1.frequency.value=54;
  const o2=AC.createOscillator(); o2.type='sawtooth'; o2.frequency.value=27.5;
  const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=180;
  const g2=AC.createGain(); g2.gain.value=0.14;
  o1.connect(lp); o2.connect(g2); g2.connect(lp); lp.connect(pan);
  o1.start(); o2.start();
  hum = { pan, lp };
}
function audioToggle(){
  audioInit();
  if(AC.state==='suspended') AC.resume();
  audioOn = !audioOn;
  master.gain.setTargetAtTime(audioOn?0.10:0.0, AC.currentTime, 0.25);
  audBtn.textContent = audioOn ? 'audio on' : 'audio off';
}
if(audBtn) audBtn.onclick = audioToggle;
function audioCue(s){
  if(!AC || !audioOn) return;
  // tendon tension-click on every morph
  const n = AC.createBufferSource(), len = 1400;
  const buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/len, 9);
  n.buffer=buf;
  const bp=AC.createBiquadFilter(); bp.type='bandpass';
  bp.frequency.value = s==='orb'?520 : s==='wheels'?880 : 1400; bp.Q.value=4;
  const g=AC.createGain(); g.gain.value=0.55;
  n.connect(bp); bp.connect(g); g.connect(master); n.start();
}

/* ══ 16. LOOP ═════════════════════════════════════════════════════════════════ */
let t=0, last=performance.now(), fpsAcc=0, fpsN=0, fps=0;
const camPos = new THREE.Vector3();
const _tmpQ = new THREE.Quaternion();
let booted=false;

function resize(){
  const w=innerWidth, h=innerHeight;
  camera.aspect=w/h;
  camera.fov = h>w ? 46 : 38;                 // phone: wider so the hand fits
  camera.updateProjectionMatrix();
  renderer.setSize(w,h,false);
  const pw=Math.max(2,Math.floor(w*DPR)), ph=Math.max(2,Math.floor(h*DPR));
  makeTargets(pw,ph);
  compMat.uniforms.uRes.value.set(pw,ph);
  conMat.uniforms.uPx.value  = DPR*(LOW?0.8:1.0);
  moteMat.uniforms.uPx.value = DPR;
  dustMat.uniforms.uPx.value = DPR;
  IN.distT = h>w ? 6.1 : 4.5;
}
addEventListener('resize', resize);

function tick(dt, instant){
  const P0 = performance.now();
  t += dt;

  /* ── state weights ease continuously; nothing crossfades, nothing dissolves ─ */
  const rate = instant ? 1 : Math.min(1, dt*2.6);
  for(const k in W) W[k] += ((STATE===k?1:0) - W[k]) * rate;

  /* ── pointer with mass: a damped spring, so it lags and overshoots ────────── */
  const kSpring = 26.0, kDamp = 7.2;
  IN.vx += (IN.px - IN.tx)*kSpring*dt; IN.vx *= Math.exp(-kDamp*dt); IN.tx += IN.vx*dt;
  IN.vy += (IN.py - IN.ty)*kSpring*dt; IN.vy *= Math.exp(-kDamp*dt); IN.ty += IN.vy*dt;

  /* ── proximity: how close the pointer is to the entity on screen ──────────── */
  const pd = Math.hypot(IN.px, IN.py);
  IN.proxT = Math.max(0, 1 - pd/0.85);
  IN.prox += (IN.proxT - IN.prox)*Math.min(1, dt*3.4);

  /* ── grasp: click-and-hold contracts ──────────────────────────────────────── */
  IN.graspT = IN.down ? 1 : 0;
  IN.grasp += (IN.graspT - IN.grasp)*Math.min(1, dt*(IN.down?4.6:2.6));

  /* ── camera orbit with momentum ───────────────────────────────────────────── */
  if(!IN.dragging){ IN.orbVYaw*=Math.exp(-1.9*dt); IN.orbVPitch*=Math.exp(-1.9*dt); }
  else            { IN.orbVYaw*=Math.exp(-9.0*dt); IN.orbVPitch*=Math.exp(-9.0*dt); }
  IN.orbYaw   += IN.orbVYaw;
  IN.orbPitch  = Math.max(-0.62, Math.min(0.92, IN.orbPitch + IN.orbVPitch));
  IN.dist += (IN.distT-IN.dist)*Math.min(1, dt*2.6);

  const idleDrift = Math.sin(t*0.07)*0.055;
  const oy = IN.orbYaw + idleDrift, op = IN.orbPitch;
  camPos.set(Math.sin(oy)*Math.cos(op), Math.sin(op)+0.16, Math.cos(oy)*Math.cos(op)).multiplyScalar(IN.dist);
  camera.position.lerp(camPos, instant?1:Math.min(1,dt*7.5));
  camera.lookAt(0, -0.06, 0);

  /* ── pose + FK ────────────────────────────────────────────────────────────── */
  const P = lerpPose(W);
  // breathing: nothing is ever perfectly still
  const breath = 1 + Math.sin(t*0.72)*0.0125 + Math.sin(t*0.31+1.4)*0.006;
  const tremorAmp = 0.55 + W.idle*0.75;
  solveFK(P, t, tremorAmp, IN.grasp*(1-W.wheels), IN.prox*(0.55+0.45*W.hand)*(1-W.orb));
  rig.scale.setScalar(breath);
  rig.position.set(0, -0.20 + Math.sin(t*0.72)*0.012, 0);

  /* ── WHEELS: blend each segment's WORLD transform onto the orbital rings ──── */
  const ww = W.wheels;
  for(let i=0;i<SEG.length;i++){
    const s = SEG[i];
    if(ww > 0.0008){
      const R = RINGS[i%3];
      const idx = Math.floor(i/3), cnt = Math.ceil(SEG.length/3);
      const a = (idx/cnt)*6.28318 + t*R.sp;
      _ringP.set(Math.cos(a)*R.r, Math.sin(a)*R.r, 0).applyQuaternion(R.q);
      _ringT.set(-Math.sin(a), Math.cos(a), 0).applyQuaternion(R.q).normalize();
      _ringQ.setFromUnitVectors(_UP, _ringT);
      s.wP.copy(s.fkP).lerp(_ringP, ww);
      s.wQ.copy(s.fkQ).slerp(_ringQ, ww);
    } else {
      s.wP.copy(s.fkP); s.wQ.copy(s.fkQ);
    }
    s.bone.position.copy(s.wP); s.bone.quaternion.copy(s.wQ);
    s.skin.position.copy(s.wP); s.skin.quaternion.copy(s.wQ);
  }

  /* ── palm shell shrinks to a core hub in WHEELS, tightens in ORB ──────────── */
  const palmS = (1 - ww*0.62) * (1 - W.orb*0.10);
  palmSkin.scale.setScalar(palmS);
  palmSkin.position.set(0,0,0);
  carpus.visible = ww < 0.86;
  carpus.scale.setScalar(1 - ww*0.55);

  /* ── webbing between digit bases ──────────────────────────────────────────── */
  for(const w of WEBS){
    const A = SEG.find(s=>s.d===w.a && s.s===1), B = SEG.find(s=>s.d===w.b && s.s===1);
    if(!A||!B) continue;
    const g=w.mesh.geometry, p=g.attributes.position, n=g.attributes.normal;
    const a0=A.j0, a1=A.j0.clone().lerp(A.j1,0.42);
    const b0=B.j0, b1=B.j0.clone().lerp(B.j1,0.42);
    p.setXYZ(0,a0.x,a0.y,a0.z); p.setXYZ(1,b0.x,b0.y,b0.z);
    p.setXYZ(2,a1.x,a1.y,a1.z); p.setXYZ(3,b1.x,b1.y,b1.z);
    p.needsUpdate=true;
    _v1.subVectors(b0,a0); _v2.subVectors(a1,a0); _v1.cross(_v2).normalize();
    for(let i=0;i<4;i++) n.setXYZ(i,_v1.x,_v1.y,_v1.z);
    n.needsUpdate=true;
    w.mesh.material.uniforms.uOpacity.value = (1-ww)*(1-W.orb*0.55);
  }

  /* ── conduits follow the blended segment chain ────────────────────────────── */
  {
    let k=0;
    const conAmp = 0.55 + IN.prox*1.15 + IN.grasp*0.55 + W.orb*0.75 + W.wheels*0.40;
    for(const c of conduits){
      const segs = c.segIdx;
      for(let i=0;i<c.n;i++,k++){
        const u = i/(c.n-1) * (segs.length-0.001);
        const si = Math.min(segs.length-1, Math.floor(u));
        const f  = u-si;
        const s  = SEG[segs[si]];
        // walk from j0 to j1 of the segment, offset to the palmar side
        _v1.copy(s.j0).lerp(s.j1, f);
        _v2.set(0,0,(s.r0+s.r1)*0.5*0.86).applyQuaternion(s.wQ);
        // when wheels pull the segment away, j0/j1 are stale — use the blended centre
        if(ww>0.0008){
          _v1.lerp(s.wP, ww*0.92);
        }
        _v1.add(_v2);
        conPos[k*3]=_v1.x; conPos[k*3+1]=_v1.y; conPos[k*3+2]=_v1.z;
        conBr[k] = 0.35 + 0.65*Math.sin(t*1.7 + i*0.31 + c.segIdx[0]);
      }
    }
    conGeo.attributes.position.needsUpdate=true;
    conGeo.attributes.aBr.needsUpdate=true;
    conMat.uniforms.uT.value = t;
    conMat.uniforms.uAmp.value = conAmp * (1 - ww*0.45);
  }

  /* ── feed the conduit brightness back INTO the skin (lit from within) ─────── */
  {
    const base = 0.10 + IN.prox*0.42 + IN.grasp*0.30 + W.orb*0.50;
    for(let i=0;i<SEG.length;i++){
      const s=SEG[i];
      const p = base*(0.55+0.45*Math.sin(t*2.1 - i*0.42));
      const u = s.skin.material.uniforms;
      u.uPulse.value = p; u.uT.value=t;
      u.uSSSInt.value = 0.80 + W.orb*0.55 + IN.grasp*0.20;
      u.uOpacity.value = 1.0;
    }
    const pu = palmSkin.material.uniforms;
    pu.uPulse.value = base*1.25; pu.uT.value=t;
    pu.uOpacity.value = (1-ww*0.55);
    for(const w of WEBS){ w.mesh.material.uniforms.uPulse.value=base*1.5; w.mesh.material.uniforms.uT.value=t; }
  }

  /* ── motes ride their segment; in ORB they re-cluster onto a shell ────────── */
  {
    const orbW=W.orb;
    for(let i=0;i<MOTE_N;i++){
      const s = SEG[moteSeg[i]];
      _v1.set(moteOff[i*3],moteOff[i*3+1],moteOff[i*3+2]).applyQuaternion(s.wQ).add(s.wP);
      if(orbW>0.002){
        const L=_v1.length()||1e-4;
        const target = 0.70 + 0.10*Math.sin(motePh[i]*3.1);
        _v2.copy(_v1).multiplyScalar(target/L);
        _v1.lerp(_v2, orbW*0.85);
      }
      const j = 0.006*Math.sin(t*3.1+motePh[i]);
      motePos[i*3]=_v1.x+j; motePos[i*3+1]=_v1.y+j*0.7; motePos[i*3+2]=_v1.z-j;
    }
    moteGeo.attributes.position.needsUpdate=true;
    moteMat.uniforms.uT.value=t;
    moteMat.uniforms.uE.value=0.5+IN.prox*0.6+W.orb*0.7;
  }

  /* ── orb containment shell ────────────────────────────────────────────────── */
  orbShell.material.uniforms.uT.value=t;
  orbShell.material.uniforms.uOp.value=Math.pow(W.orb,1.5)*0.9;
  orbShell.visible = W.orb>0.01;
  orbShell.scale.setScalar(0.98+Math.sin(t*0.9)*0.014);

  /* ── occluders drive BOTH the floor penumbra and the dust shafts ──────────── */
  {
    const pick = [SEG[1],SEG[5],SEG[9],SEG[13],SEG[17],SEG[3]];
    occPos[0].set(rig.position.x, rig.position.y, rig.position.z, 0.40*palmS);
    for(let i=0;i<6;i++){
      const s = pick[i] || SEG[0];
      _v1.copy(s.wP).applyQuaternion(rig.quaternion).multiplyScalar(breath).add(rig.position);
      occPos[i+1].set(_v1.x, _v1.y, _v1.z, (s.r0+s.r1)*1.9);
    }
  }

  /* ── active digit tip = DoF focus (index distal) ──────────────────────────── */
  {
    const tipSeg = SEG.find(s=>s.id==='index' && s.s===3) || SEG[SEG.length-1];
    TIP.copy(tipSeg.wP).applyQuaternion(rig.quaternion).multiplyScalar(breath).add(rig.position);
    const fd = camera.position.distanceTo(TIP);
    compMat.uniforms.uFocus.value += (fd - compMat.uniforms.uFocus.value)*Math.min(1,dt*3.0);
  }

  dustMat.uniforms.uT.value=t;
  key.target.position.set(0,-0.1,0);

  /* ══ RENDER ═════════════════════════════════════════════════════════════════ */
  renderer.setRenderTarget(rtScene);
  renderer.clear();
  renderer.render(scene, camera);

  brightMat.uniforms.tD.value = rtScene.texture;
  blit(brightMat, rtA0);
  blurMat.uniforms.tD.value=rtA0.texture; blurMat.uniforms.uTex.value.set(rtA0.width,rtA0.height);
  blurMat.uniforms.uDir.value.set(1,0); blit(blurMat, rtA1);
  blurMat.uniforms.tD.value=rtA1.texture; blurMat.uniforms.uDir.value.set(0,1); blit(blurMat, rtA0);

  downMat.uniforms.tD.value=rtA0.texture; downMat.uniforms.uTex.value.set(rtA0.width,rtA0.height);
  blit(downMat, rtB0);
  blurMat.uniforms.tD.value=rtB0.texture; blurMat.uniforms.uTex.value.set(rtB0.width,rtB0.height);
  blurMat.uniforms.uDir.value.set(1,0); blit(blurMat, rtB1);
  blurMat.uniforms.tD.value=rtB1.texture; blurMat.uniforms.uDir.value.set(0,1); blit(blurMat, rtB0);

  compMat.uniforms.tScene.value  = rtScene.texture;
  compMat.uniforms.tBloomA.value = rtA0.texture;
  compMat.uniforms.tBloomB.value = rtB0.texture;
  compMat.uniforms.tDepth.value  = depthTex;
  compMat.uniforms.uT.value = t;
  compMat.uniforms.uAperture.value = 0.9 + W.wheels*0.5;
  blit(compMat, null);

  /* ── chrome auto-hide ─────────────────────────────────────────────────────── */
  if(UI && chromeT && performance.now()-chromeT > 3200) { chrome.classList.remove('on'); chromeT=0; }

  const spent = performance.now()-P0;
  return spent;
}

function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now-last)/1000 || 0.016); last=now;
  try{ tick(dt,false); }catch(e){ fatal(e); throw e; }
  fpsAcc += 1/Math.max(dt,1e-4); fpsN++;
  if(fpsN>=30){ fps = fpsAcc/fpsN; fpsAcc=0; fpsN=0; window.XENOS.fps = Math.round(fps*10)/10; }
  if(!booted){ booted=true; document.getElementById('boot').classList.add('gone');
    window.XENOS.ready = true; }
}

/* ══ 17. PUBLIC API — so a machine can verify this without clicking ══════════ */
window.XENOS = {
  ready:false, fps:0,
  get state(){ return STATE; },
  setState,
  get weights(){ return {...W}; },
  renderer: IS_WEBGL2 ? 'webgl2' : 'webgl1',
  gpu: gpuInfo,
  toggleAudio: audioToggle,
  three: THREE.REVISION,
  segments: SEG.length,
  counts: { motes:MOTE_N, dust:DUST_N, conduits:CON_N }
};

/* ── boot ─────────────────────────────────────────────────────────────────── */
resize();
solveFK(POSE.idle, 0, 0, 0, 0);          // rest pose so AO bakes against real geometry
for(const s of SEG){ s.wP.copy(s.fkP); s.wQ.copy(s.fkQ);
  s.bone.position.copy(s.wP); s.bone.quaternion.copy(s.wQ);
  s.skin.position.copy(s.wP); s.skin.quaternion.copy(s.wQ); }
bakeAO();
const s0 = QS.get('state');
if(s0 && s0 in W){ STATE=s0; for(const k in W) W[k]=(k===s0?1:0); }
for(const b of chrome.querySelectorAll('[data-s]')) b.classList.toggle('a', b.dataset.s===STATE);
if(UI) wake();
requestAnimationFrame(frame);
</script>
</body>
