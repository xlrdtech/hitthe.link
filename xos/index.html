<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Xenphone OS — iOS 27 · dark</title>

  <!-- qi 2026-05-17 8672: per-subpage favicon canon. Each subdir under
       hitthe.link binds its own <link rel="icon"> so browsers use page-specific
       icons in tabs and home-screen adds. Source = Cloudinary brand asset
       referenced in /site.webmanifest. Replace with /_shared/brand-icon.* if
       a local copy is uploaded. -->
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="shortcut icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Xenphone OS" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Inter added 2026-08-12 18:27. qi: "the bubbles aren't the same, this looks
       like a knock off, like a cheap imitation of it" (VVSVEI inside XOS).
       MEASURED ROOT CAUSE: VvsveiPane hoists the fetched page's <style> tags but
       NEVER its <link rel=stylesheet>, and standalone VVSVEI loads Inter from
       Google. So .bubble-txt (Inter 15px/500) fell back to system inside XOS —
       identical layout, wrong typeface, which is exactly what "cheap imitation"
       looks like. Also PRE-EXISTING: styles.css asks for 'Inter' at 1583, 1608,
       1648, 1764 and 2087 and this file never requested it, so those five have
       been silently falling back all along. One line fixes both.
       RULE: hoisting <style> is not enough — a font arrives via <link>. -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600;700&family=Share+Tech+Mono&family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="root"></div>

  <!-- PRODUCTION React (2026-08-12 18:42). qi's XOS was loading the DEVELOPMENT
       builds on every single load. MEASURED at unpkg:
         react-dom.development.js  1,080,227 B  →  production.min  131,835 B  (8.2x)
         react.development.js        109,931 B  →  production.min   10,751 B  (10.2x)
         total                     1,190,158 B  →              142,586 B
       = 1.05 MB less per load, plus the dev builds' propType/warning machinery
       is deliberately slow at runtime. This is why XOS took >60s to reach
       domcontentloaded in a real browser (measured twice); the SERVER was never
       the problem — shell TTFB 57ms, app.jsx 30ms, styles.css 35ms.

       ⚠️ integrity= MUST be recomputed when the URL changes, or the browser
       BLOCKS the script and XOS goes from slow to DEAD. These two sha384 values
       were computed from the actual fetched files, not copied from anywhere:
         openssl dgst -sha384 -binary <file> | openssl base64 -A

       STILL OPEN, and qi's call because canon 9 bans a React build/bundler:
       @babel/standalone below is a ~3MB compiler that transpiles FOUR .jsx files
       (tweaks-panel, ios-frame, app 105KB, xos-browser) in-browser on the main
       thread every load — and it grows with every edit I make to app.jsx. -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
  <script type="text/babel" src="xos-browser.jsx"></script>

  <script>
    // Register service worker for offline shell + asset cache (qi 2026-05-22 ultrathink xos 100%)
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("service-worker.js", { scope: "/xos/" }).catch(() => {});
      });
    }
  </script>
<script src="https://hitthe.link/lib/grid-autofix.js" defer></script>
</body>
</html>
