<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>XENOS — live avatar</title>
<style>
  html,body{margin:0;height:100%;background:#000;color:#e8e8ea;
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
    overflow:hidden;-webkit-font-smoothing:antialiased}
  #stage{position:fixed;inset:0;border:0;width:100%;height:100%;background:#000;
    opacity:0;transition:opacity .45s ease}
  #stage.on{opacity:1}
  #tag{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
    text-align:center;font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:#8a8a92;pointer-events:none;text-shadow:0 1px 6px #000}
  #tag b{color:#d8d8de;font-weight:600}
  #err{position:fixed;inset:0;display:none;place-content:center;text-align:center;padding:24px}
  #err.on{display:grid}
</style>
<iframe id="stage" title="XENOS avatar" allow="autoplay; xr-spatial-tracking"></iframe>
<div id="err">avatar pointer unreachable — <code>/avatar.json</code></div>
<div id="tag">XENOS · <b id="who">…</b></div>
<script>
// Canonical avatar selector. /avatar.json {"active":"<variant>"} decides what renders.
// Before this page existed avatar.json had ZERO readers site-wide (measured 2026-08-26)
// — flipping it changed nothing. This is the reader that makes the pointer real.
const VARIANTS = {
  plasma:     '/xenos-plasma/',
  xenos:      '/xenos/',
  v3:         '/xenos-v3/',
  world:      '/xenos-world/',
  env:        '/xenos-env/',
  variations: '/xenos-variations/',
  ophanim:    '/vei/avatar/'
};
const FALLBACK = 'plasma';
const stage = document.getElementById('stage');
const who = document.getElementById('who');
const err = document.getElementById('err');
let current = null;

function resolve(name){
  if (!name) return null;
  const k = String(name).toLowerCase().replace(/^xenos-?/, '') || 'xenos';
  return VARIANTS[k] || VARIANTS[String(name).toLowerCase()] || null;
}

async function tick(){
  try {
    const r = await fetch('/avatar.json?t=' + Date.now(), {cache:'no-store'});
    if (!r.ok) throw new Error('http ' + r.status);
    const j = await r.json();
    const name = j.active || FALLBACK;
    const url = resolve(name) || VARIANTS[FALLBACK];
    err.classList.remove('on');
    if (url !== current){
      current = url;
      stage.classList.remove('on');
      stage.src = url;
      stage.onload = () => stage.classList.add('on');
      who.textContent = name;
      document.title = 'XENOS — ' + name;
    }
  } catch(e){
    if (!current) err.classList.add('on');
    who.textContent = 'offline';
  }
}
tick();
setInterval(tick, 5000);            // live by default, no refresh
addEventListener('focus', tick);
</script>
